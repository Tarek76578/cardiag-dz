name: CarDiag Autonomous Agent

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: write
  pull-requests: write
  issues: write

concurrency:
  group: cardiag-autonomous-agent
  cancel-in-progress: false

jobs:
  agent:
    name: Autonomous engineering agent
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Agent trigger validation
        run: |
          set -euo pipefail
          echo "AGENT_TRIGGER_OK"
          echo "event=${GITHUB_EVENT_NAME}"
          echo "ref=${GITHUB_REF}"
          echo "sha=${GITHUB_SHA}"

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.CARDIAG_WORKFLOW_TOKEN }}

      - name: Verify repository instructions
        run: |
          set -euo pipefail
          test -f AGENTS.md
          test -f agent-state.md

      - name: Verify agent credentials
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_TOKEN: ${{ secrets.CARDIAG_WORKFLOW_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$OPENROUTER_API_KEY"
          test -n "$GH_TOKEN"

      - name: Install Codex
        run: npm install -g @openai/codex

      - name: Autonomous engineering cycle
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_TOKEN: ${{ secrets.CARDIAG_WORKFLOW_TOKEN }}
          CODEX_HOME: ${{ github.workspace }}/.codex
        run: |
          set -euo pipefail
          mkdir -p "$CODEX_HOME"
          cat > "$CODEX_HOME/config.toml" <<'EOF'
model = "openrouter/free"
model_provider = "openrouter"
model_reasoning_effort = "high"
approval_policy = "never"
sandbox_mode = "danger-full-access"

[model_providers.openrouter]
name = "OpenRouter"
base_url = "https://openrouter.ai/api/v1"
env_key = "OPENROUTER_API_KEY"
EOF
          codex exec --full-auto --skip-git-repo-check "You are the autonomous principal engineer, product engineer, QA engineer, security reviewer, and release engineer for CarDiag DZ. Read AGENTS.md and agent-state.md first. Inspect the entire repository and current CI before changing anything. Make the product genuinely production-quality for the Algerian automotive market. Work autonomously on the highest-value concrete problems you can verify across architecture, Kotlin/Compose UI, UX, Arabic RTL, French localization, accessibility, performance, reliability, security, data integrity, vehicle catalog quality, diagnostics logic, tests, Gradle and CI/CD. Use repository evidence only; never invent automotive specifications, diagnostic facts, prices, services, test results, or completion claims. Run real validation, inspect failures, fix root causes, never weaken tests, and keep secrets out of source control. Update agent-state.md with evidence, completed work, validation results, blockers and next priorities. Make coherent production-quality changes. Do not create an infinite self-triggering loop."

      - name: Final integrity check
        run: |
          set -euo pipefail
          git diff --check
          test -f AGENTS.md
          test -f agent-state.md

      - name: Commit and push agent changes
        env:
          GH_TOKEN: ${{ secrets.CARDIAG_WORKFLOW_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No changes produced by agent.'
            exit 0
          fi
          git add -A
          git commit -m 'chore(agent): autonomous engineering cycle'
          git fetch origin main
          git rebase origin/main
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git push origin HEAD:main

name: CarDiag Agent

# GitHub workflow-dispatch registration refresh

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Agent task selector'
        required: false
        default: 'next'
        type: choice
        options:
          - next

  # Fallback trigger because GitHub's workflow-dispatch registration
  # is currently returning HTTP 422 for this workflow.
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: cardiag-agent-main
  cancel-in-progress: false

env:
  OLLAMA_MODEL: qwen2.5-coder:3b
  OLLAMA_HOST: http://127.0.0.1:11434
  GITHUB_EVENT_HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}

jobs:
  agent:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[agent-run]')
    name: Autonomous engineering cycle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify manual trigger and baseline
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = main
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            test "${{ inputs.task }}" = next
          else
            test "$GITHUB_EVENT_NAME" = push
            echo "$GITHUB_EVENT_HEAD_COMMIT_MESSAGE" | grep -Fq '[agent-run]'
          fi
          test -f AGENTS.md
          test -f android/gradlew
          test -f android/app/build.gradle.kts
          test -f docs/agent-next-task.md
          git diff --check
          test -z "$(git status --porcelain)"
          echo CARdiag_AGENT_TRIGGER_OK

      - name: Cache Ollama model
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-${{ runner.os }}-${{ env.OLLAMA_MODEL }}-v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Setup Ollama
        run: |
          set -euo pipefail
          if ! command -v ollama >/dev/null 2>&1; then
            curl -fsSL https://ollama.com/install.sh | sh
          fi
          ollama --version
          nohup ollama serve >/tmp/ollama.log 2>&1 &
          echo $! >/tmp/ollama.pid
          ready=0
          for i in $(seq 1 60); do
            if curl -fsS "$OLLAMA_HOST/api/tags" >/tmp/ollama-tags.json 2>/dev/null; then
              ready=1
              echo "OLLAMA_HTTP_READY attempt=$i"
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo 'Ollama did not become ready.' >&2
            cat /tmp/ollama.log >&2 || true
            exit 20
          fi
          if ! grep -q 'qwen2.5-coder:3b' /tmp/ollama-tags.json; then
            echo "Pulling $OLLAMA_MODEL"
            ollama pull "$OLLAMA_MODEL"
          fi
          ollama list
          curl -fsS "$OLLAMA_HOST/api/show" \
            -H 'Content-Type: application/json' \
            -d "{\"name\":\"$OLLAMA_MODEL\"}" >/tmp/ollama-show.json
          grep -q 'qwen2.5-coder' /tmp/ollama-show.json
          echo "AI_PROVIDER_SUCCESS=ollama/$OLLAMA_MODEL"

      - name: Install Aider
        run: |
          set -euo pipefail
          python3 -m pip install --user --upgrade aider-chat
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/aider" --version

      - name: Run autonomous agent
        timeout-minutes: 30
        env:
          OLLAMA_API_BASE: http://127.0.0.1:11434
          OLLAMA_MODEL: qwen2.5-coder:3b
          AIDER_MODEL: ollama_chat/qwen2.5-coder:3b
        run: |
          set -euo pipefail
          chmod +x scripts/autonomous-agent.sh
          ./scripts/autonomous-agent.sh

      - name: Validate Android output
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease bundleRelease --stacktrace

      - name: Final integrity check
        run: |
          set -euo pipefail
          git diff --check
          test -f AGENTS.md
          test -f android/app/build.gradle.kts
          echo 'Changed files after validation:'
          git status --short
          allowed='android/app/src/main/java/dz/cardiag/app/core/road/RoadAssistantService.kt
android/app/src/main/java/dz/cardiag/app/core/road/RoadAssistantProviders.kt'
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            if ! printf '%s\n' "$allowed" | grep -Fxq "$file"; then
              echo "UNEXPECTED_VALIDATED_CHANGE=$file" >&2
              exit 40
            fi
          done < <(git diff --name-only)

      - name: Commit only validated task files
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            android/app/src/main/java/dz/cardiag/app/core/road/RoadAssistantService.kt \
            android/app/src/main/java/dz/cardiag/app/core/road/RoadAssistantProviders.kt
          if git diff --cached --quiet; then
            echo 'No validated code changes to commit.'
            exit 41
          fi
          git commit -m 'feat(road): add live nearby service provider'
          git push origin HEAD:main

      - name: Upload results
        uses: actions/upload-artifact@v6
        with:
          name: cardiag-agent-results
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
            agent-state.md
          if-no-files-found: warn
          retention-days: 14

      - name: Stop Ollama
        if: always()
        run: |
          if [ -f /tmp/ollama.pid ]; then kill "$(cat /tmp/ollama.pid)" 2>/dev/null || true; fi

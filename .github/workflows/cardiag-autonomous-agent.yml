name: CarDiag Agent

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Agent task selector'
        required: false
        default: 'next'
        type: choice
        options:
          - next
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: cardiag-agent-main
  cancel-in-progress: false

env:
  FREELLMAPI_PORT: '3001'
  FREELLMAPI_PROXY_PORT: '3002'
  GITHUB_EVENT_HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}

jobs:
  agent:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[agent-run]')
    name: Autonomous engineering cycle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify manual trigger and baseline
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = main
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            test "${{ inputs.task }}" = next
          else
            test "$GITHUB_EVENT_NAME" = push
            echo "$GITHUB_EVENT_HEAD_COMMIT_MESSAGE" | grep -Fq '[agent-run]'
          fi
          test -f AGENTS.md
          test -f android/gradlew
          test -f android/app/build.gradle.kts
          test -f docs/agent-next-task.md
          git diff --check
          test -z "$(git status --porcelain)"
          echo CARdiag_AGENT_TRIGGER_OK

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Start FreeLLMAPI-Extended gateway
        working-directory: /tmp
        run: |
          set -euo pipefail
          rm -rf freellmapi
          git clone --depth 1 https://github.com/SeyhmusKaya/freellmapi-extended.git freellmapi
          cd freellmapi
          npm ci
          export ENCRYPTION_KEY="$(node -e "console.log(require('crypto').randomBytes(32).toString('hex'))")"
          export PORT="$FREELLMAPI_PORT"
          export NODE_ENV=development
          npm run dev > /tmp/freellmapi.log 2>&1 &
          echo $! >/tmp/freellmapi.pid
          ready=0
          for i in $(seq 1 90); do
            if curl -fsS "http://127.0.0.1:$FREELLMAPI_PORT/health" >/tmp/freellmapi-health.json 2>/dev/null; then
              ready=1
              echo "FREELLMAPI_GATEWAY_READY attempt=$i"
              cat /tmp/freellmapi-health.json
              break
            fi
            sleep 2
          done
          test "$ready" = 1 || { cat /tmp/freellmapi.log >&2 || true; exit 20; }
          curl -fsS "http://127.0.0.1:$FREELLMAPI_PORT/v1/models" >/tmp/freellmapi-models.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/freellmapi-models.json'))
          items=d.get('data', d if isinstance(d,list) else [])
          print('FREELLMAPI_MODEL_COUNT=', len(items))
          for m in items[:30]: print(m.get('id','<unknown>'))
          if not items: raise SystemExit('FreeLLMAPI returned no models')
          PY

      - name: Validate keyless FreeLLMAPI chat + tool calling
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request
          body={
            'model':'',
            'messages':[{'role':'system','content':'You are a coding-agent probe. Call the supplied tool before answering.'},{'role':'user','content':'Read the project status file and return its first line.'}],
            'tools':[{'type':'function','function':{'name':'read_project_file','description':'Read a UTF-8 project file.','parameters':{'type':'object','properties':{'path':{'type':'string'}},'required':['path']}}}],
            'tool_choice':'required'
          }
          req=urllib.request.Request('http://127.0.0.1:3001/v1/chat/completions',data=json.dumps(body).encode(),headers={'Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=120) as r:
            data=json.load(r)
          msg=data['choices'][0]['message']
          calls=msg.get('tool_calls') or []
          if not calls or calls[0].get('function',{}).get('name')!='read_project_file':
            raise SystemExit('FreeLLMAPI keyless tool-calling probe failed')
          print('FREELLMAPI_KEYLESS_TOOL_CALLING_SUCCESS')
          PY

      - name: Start keyless OpenAI compatibility shim
        run: |
          set -euo pipefail
          cat >/tmp/keyless_proxy.py <<'PY'
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          from urllib.request import Request, urlopen
          import os
          UP='http://127.0.0.1:3001'
          class H(BaseHTTPRequestHandler):
              def do_POST(self): self.proxy()
              def do_GET(self): self.proxy()
              def proxy(self):
                  n=int(self.headers.get('Content-Length','0'))
                  body=self.rfile.read(n) if n else None
                  headers={k:v for k,v in self.headers.items() if k.lower() not in ('host','authorization','content-length')}
                  req=Request(UP+self.path,data=body,headers=headers,method=self.command)
                  try:
                      with urlopen(req,timeout=180) as r:
                          data=r.read(); self.send_response(r.status)
                          for k,v in r.headers.items():
                              if k.lower() not in ('transfer-encoding','content-length','connection'):
                                  self.send_header(k,v)
                          self.send_header('Content-Length',str(len(data))); self.end_headers(); self.wfile.write(data)
                  except Exception as e:
                      self.send_response(502); self.send_header('Content-Type','text/plain'); self.end_headers(); self.wfile.write(str(e).encode())
              def log_message(self,*args): pass
          ThreadingHTTPServer(('127.0.0.1',3002),H).serve_forever()
          PY
          nohup python3 /tmp/keyless_proxy.py >/tmp/keyless-proxy.log 2>&1 &
          echo $! >/tmp/keyless-proxy.pid
          sleep 1
          curl -fsS http://127.0.0.1:3002/health >/tmp/proxy-health.json
          echo KEYLESS_PROXY_READY

      - name: Install Aider
        run: |
          set -euo pipefail
          python3 -m pip install --user --upgrade aider-chat
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/aider" --version

      - name: Select coding model from FreeLLMAPI catalog
        run: |
          set -euo pipefail
          MODEL="$(python3 - <<'PY'
          import json
          items=json.load(open('/tmp/freellmapi-models.json')).get('data',[])
          ids=[str(x.get('id','')) for x in items if x.get('id')]
          preferred=('coder','coding','devstral','codestral','qwen','deepseek','kimi')
          for needle in preferred:
              for mid in ids:
                  if needle in mid.lower():
                      print(mid); raise SystemExit
          print(ids[0])
          PY
          )"
          test -n "$MODEL"
          echo "FREELLMAPI_MODEL=$MODEL" >> "$GITHUB_ENV"
          echo "Selected FreeLLMAPI model: $MODEL"

      - name: Run autonomous agent through FreeLLMAPI
        timeout-minutes: 30
        env:
          AI_PROVIDER: freellmapi
          OPENAI_API_BASE: http://127.0.0.1:3002/v1
          OPENAI_API_KEY: keyless-local-gateway
          AIDER_MODEL: openai/${{ env.FREELLMAPI_MODEL }}
        run: |
          set -euo pipefail
          chmod +x scripts/autonomous-agent.sh
          ./scripts/autonomous-agent.sh

      - name: Validate Android output
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease bundleRelease --stacktrace

      - name: Final integrity check
        run: |
          set -euo pipefail
          git diff --check
          test -f AGENTS.md
          test -f android/app/build.gradle.kts
          allowed='android/app/src/main/java/dz/cardiag/app/core/road/RoadAssistantService.kt
android/app/src/main/java/dz/cardiag/app/core/road/RoadAssistantProviders.kt'
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            if ! printf '%s\n' "$allowed" | grep -Fxq "$file"; then
              echo "UNEXPECTED_VALIDATED_CHANGE=$file" >&2
              exit 40
            fi
          done < <(git diff --name-only)
          echo 'VALIDATED_SCOPE_OK'

      - name: Commit only validated task files
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            android/app/src/main/java/dz/cardiag/app/core/road/RoadAssistantService.kt \
            android/app/src/main/java/dz/cardiag/app/core/road/RoadAssistantProviders.kt
          if git diff --cached --quiet; then
            echo 'No validated code changes to commit.'
            exit 41
          fi
          git commit -m 'feat(road): add live nearby service provider [agent-run]'
          git push origin HEAD:main

      - name: Upload results
        uses: actions/upload-artifact@v6
        with:
          name: cardiag-agent-results
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
            agent-state.md
          if-no-files-found: warn
          retention-days: 14

      - name: Stop services
        if: always()
        run: |
          if [ -f /tmp/keyless-proxy.pid ]; then kill "$(cat /tmp/keyless-proxy.pid)" 2>/dev/null || true; fi
          if [ -f /tmp/freellmapi.pid ]; then kill "$(cat /tmp/freellmapi.pid)" 2>/dev/null || true; fi

name: CarDiag Autonomous Agent

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Trigger check
        run: echo AGENT_TRIGGER_OK

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Deep audit and autonomous engineering
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CODEX_HOME: ${{ github.workspace }}/.codex
        run: |
          set -euo pipefail
          mkdir -p "$CODEX_HOME"
          cat > "$CODEX_HOME/config.toml" <<'EOF'
model = "openrouter/free"
model_provider = "openrouter"
approval_policy = "never"
sandbox_mode = "danger-full-access"

[model_providers.openrouter]
name = "OpenRouter"
base_url = "https://openrouter.ai/api/v1"
env_key = "OPENROUTER_API_KEY"
EOF
          npm install -g @openai/codex
          test -n "$OPENROUTER_API_KEY"
          codex exec --full-auto --skip-git-repo-check "Read AGENTS.md and agent-state.md. Perform a deep evidence-based audit of the entire CarDiag repository before changing anything. Research official Android documentation, authoritative OBD references, reputable competitor documentation, and current Algerian automotive-market information. Audit architecture, Kotlin/Compose UI, navigation/state, crashes, permissions, Bluetooth/OBD/ELM327, VIN/DTC/live data, vehicle-data integrity, Arabic RTL, French localization, accessibility, adaptive UI, performance, privacy/security, Supabase/RLS, dependencies, Gradle, tests, runtime coverage, release readiness and CI. Compare CarDiag with Carista, OBDeleven and Torque. Record source URLs and dates and findings in market-audit.md. Never fabricate automotive facts, prices, services or test results. Rank findings and implement only verified high-value improvements. Add tests for meaningful changes, run real validation, never weaken tests, update agent-state.md with evidence and blockers, and never create another workflow or commit secrets."

      - name: Validate Android
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease bundleRelease --stacktrace

      - name: Commit and publish
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then echo 'No changes.'; exit 0; fi
          git commit -m 'chore(agent): autonomous audit and engineering cycle'
          git push origin HEAD:main

      - name: Upload results
        uses: actions/upload-artifact@v6
        with:
          name: cardiag-agent-results
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
            market-audit.md
            agent-state.md
          if-no-files-found: error
          retention-days: 14
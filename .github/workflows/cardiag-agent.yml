name: CarDiag Autonomous Agent

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  agent:
    name: Deep audit and autonomous engineering
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Trigger check
        run: echo AGENT_TRIGGER_OK

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify project
        run: |
          set -euo pipefail
          test -f AGENTS.md
          test -f agent-state.md
          test -d android

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Codex
        run: npm install -g @openai/codex

      - name: Verify AI key
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: test -n "$OPENROUTER_API_KEY"

      - name: Autonomous audit research and engineering
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CODEX_HOME: ${{ github.workspace }}/.codex
        run: |
          set -euo pipefail
          mkdir -p "$CODEX_HOME"
          cat > "$CODEX_HOME/config.toml" <<'EOF'
model = "openrouter/free"
model_provider = "openrouter"
approval_policy = "never"
sandbox_mode = "danger-full-access"

[model_providers.openrouter]
name = "OpenRouter"
base_url = "https://openrouter.ai/api/v1"
env_key = "OPENROUTER_API_KEY"
EOF
          codex exec --full-auto --skip-git-repo-check "You are the sole autonomous principal engineer for CarDiag DZ. First read AGENTS.md and agent-state.md. Then deeply inspect the entire repository before changing anything. Perform evidence-based external research using official Android/Google documentation, authoritative OBD references, reputable competitor documentation, and current Algerian automotive-market sources. Audit Android/Kotlin/Compose architecture, navigation/state, crashes/error handling, permissions, Bluetooth/OBD lifecycle and ELM327 handling, VIN/DTC/live data, vehicle data integrity, Arabic RTL and French localization, accessibility, adaptive UI, performance, privacy/security, Supabase/RLS, dependencies, Gradle, tests, runtime coverage, release readiness and CI. Compare relevant capabilities with Carista, OBDeleven and Torque. Record source URLs and dates and findings in market-audit.md. Never fabricate automotive facts, DTC meanings, prices, services or test results. Rank findings by severity, then implement the highest-value verified improvements that can safely be completed now. Add tests for meaningful changes and run real validation. Never weaken tests or hide failures. Update agent-state.md with evidence, changes, validation, blockers and next priorities. Do not create additional workflows or agents and never commit secrets."

      - name: Validate
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease bundleRelease --stacktrace

      - name: Integrity check
        run: |
          set -euo pipefail
          git diff --check
          test -f AGENTS.md
          test -f agent-state.md
          test -f market-audit.md

      - name: Commit changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes.'
            exit 0
          fi
          git commit -m 'chore(agent): autonomous audit and engineering cycle'
          git push origin HEAD:main

      - name: Upload release and audit
        uses: actions/upload-artifact@v6
        with:
          name: cardiag-agent-results
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
            market-audit.md
            agent-state.md
          if-no-files-found: error
          retention-days: 14

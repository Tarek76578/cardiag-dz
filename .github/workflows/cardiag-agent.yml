name: CarDiag Autonomous Engineer

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

concurrency:
  group: cardiag-autonomous-engineer
  cancel-in-progress: true

permissions:
  contents: write
  actions: read
  pull-requests: write
  issues: write

jobs:
  agent:
    name: Autonomous engineering cycle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Preflight Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew --version

      - name: Run baseline validation
        id: baseline
        continue-on-error: true
        run: |
          ./gradlew test lint assembleDebug --stacktrace

      - name: Run Codex autonomous engineer
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          sandbox: workspace-write
          model: gpt-5.6
          effort: high
          prompt: |
            You are the autonomous principal engineer for the Android/Kotlin repository ${{ github.repository }}.

            Read AGENTS.md first and obey it.

            Your mission is to take the repository toward production readiness without waiting for a human.
            Work on ONE highest-impact concrete blocker or coherent milestone per cycle, then validate it.

            CURRENT CONTEXT:
            - This workflow runs from main on a schedule or manual dispatch.
            - The baseline Gradle validation is intentionally allowed to fail so you can diagnose failures.
            - You have the full git history and GitHub Actions token through GH_TOKEN.
            - Inspect the latest GitHub Actions runs and job logs when useful.

            REQUIRED LOOP:
            1. Inspect repository state, recent commits, and latest CI failures.
            2. Identify the highest-impact real blocker.
            3. Inspect all related callers/models/tests before editing.
            4. Implement the smallest correct production-quality fix.
            5. Run the strongest relevant local validation available.
            6. Never disable, skip, weaken, or delete tests to make CI green.
            7. Never commit secrets.
            8. If the change is validated, commit it directly to the current main branch with a precise conventional commit message.
            9. Push the commit to origin/main so the normal Android CI starts.
            10. If validation cannot complete because of an external limitation, document the exact blocker in agent-state.md and do not fake success.

            PRIORITIES:
            correctness/crash prevention > build/CI > security > data integrity > tests > architecture > UX/UI > optimization > new features.

            CARDiag-specific acceptance goals:
            - Android/Kotlin/Compose production stability.
            - Arabic RTL and French localization remain intact.
            - Domain models are complete and consistent.
            - Supabase integration is secure and robust.
            - Diagnostic/vehicle logic is internally consistent.
            - Runtime behavior is validated when an emulator is available.
            - Release APK/AAB remains buildable.

            IMPORTANT:
            - Do not make broad speculative rewrites.
            - Do not declare the project finished because compilation succeeds.
            - Do not stop merely because the baseline is green; inspect the repository for the next real production blocker.
            - If another autonomous cycle is needed, leave the repository in a clean, committed state for the next run.
          codex-args: '["--dangerously-bypass-approvals-and-sandbox"]'

      - name: Verify final repository state
        run: |
          git status --short
          git log -1 --oneline

name: CarDiag DZ Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cardiag-android-${{ github.ref }}
  cancel-in-progress: true

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

jobs:
  build:
    name: Build, unit tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 platforms;android-36 build-tools;35.0.0"
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
      - name: Verify repository integrity
        run: |
          test -f android/gradlew
          test -f android/app/build.gradle.kts
          test -f android/app/src/main/AndroidManifest.xml
          git diff --check
      - name: Check tracked source files for committed secrets
        run: |
          python3 <<'PY'
          import pathlib, re, subprocess, sys
          files = subprocess.check_output(["git", "ls-files", "-z"], text=False).split(b"\0")
          excluded = (b".github/workflows/", b".git/", b".md")
          patterns = [
              re.compile(r"-----BEGIN (?:RSA|OPENSSH|EC|DSA|PRIVATE) KEY-----"),
              re.compile(r"AIza[0-9A-Za-z_-]{30,}"),
              re.compile(r"\bsk-[A-Za-z0-9_-]{30,}\b"),
              re.compile(r"\beyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{20,}\b"),
          ]
          hits = []
          for raw in files:
              if not raw or any(raw.startswith(x) or raw.endswith(x) for x in excluded): continue
              path = pathlib.Path(raw.decode("utf-8", "replace"))
              try: text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError): continue
              if any(p.search(text) for p in patterns): hits.append(str(path))
          if hits:
              print("Potential committed secret detected:")
              print("\n".join(sorted(set(hits))))
              sys.exit(1)
          print("No committed secret values detected in tracked source files.")
          PY
      - name: Make Gradle executable
        working-directory: android
        run: chmod +x ./gradlew
      - name: Verify Gradle wrapper
        working-directory: android
        run: ./gradlew --version
      - name: Unit test, lint and assemble debug APK
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: cardiag-dz-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  runtime:
    name: Android emulator runtime tests (non-blocking)
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-30 platforms;android-35 platforms;android-36 build-tools;35.0.0"
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
      - name: Make Gradle executable
        working-directory: android
        run: chmod +x ./gradlew
      - name: Run instrumentation tests on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data -gpu swiftshader_indirect
          disable-animations: true
          disable-linux-hw-accel: true
          force-avd-creation: true
          emulator-boot-timeout: 600
          cores: 2
          script: |
            adb wait-for-device
            adb devices
            adb shell getprop ro.build.version.sdk
            cd "$GITHUB_WORKSPACE/android"
            test -f ./gradlew
            chmod +x ./gradlew
            ./gradlew --no-daemon connectedDebugAndroidTest --stacktrace
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

  release:
    name: Release APK and AAB
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;35.0.0"
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
      - name: Make Gradle executable
        working-directory: android
        run: chmod +x ./gradlew
      - name: Assemble release APK and AAB
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease bundleRelease --stacktrace
      - name: Upload release APK
        uses: actions/upload-artifact@v6
        with:
          name: cardiag-dz-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload release AAB
        uses: actions/upload-artifact@v6
        with:
          name: cardiag-dz-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

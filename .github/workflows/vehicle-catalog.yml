name: Vehicle Catalog Import

on:
  push:
    paths:
      - '.github/workflows/vehicle-catalog.yml'
      - 'tools/vehicle_catalog/import_engines_v2.py'
  workflow_dispatch:
    inputs:
      scope:
        description: 'Catalog scope'
        required: true
        default: 'all'
        type: choice
        options:
          - algeria-priority
          - all

permissions:
  contents: read

env:
  SUPABASE_URL: https://knripjpkmvdmqtstkcmo.supabase.co
  SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtucmlwanBrbXZkbXF0c3RrY21vIiwiaWF0IjoxNzg3NDMwNDMzLCJleHAiOjIxMDMwMDY0MzB9.1AKcbWMdzy0r2knTq0Ols8Oaw5zr2mTVaBjBqeAHWCY' }}

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Import complete canonical catalog
        env:
          CATALOG_SCOPE: ${{ inputs.scope || 'all' }}
        run: python tools/vehicle_catalog/import_engines_v2.py --scope "$CATALOG_SCOPE"
      - name: Verify canonical catalog through Supabase REST
        run: |
          python - <<'PY'
          import json, os, urllib.request
          base=os.environ['SUPABASE_URL'].rstrip('/')
          key=os.environ['SUPABASE_ANON_KEY']
          url=base+'/rest/v1/vehicle_catalog_canonical?select=id&limit=1'
          req=urllib.request.Request(url,headers={'apikey':key,'Authorization':'Bearer '+key})
          try:
              with urllib.request.urlopen(req,timeout=30) as r:
                  data=json.load(r)
          except Exception as exc:
              raise SystemExit(f'Supabase verification request failed: {exc}')
          if not isinstance(data,list):
              raise SystemExit(f'Unexpected Supabase response: {data!r}')
          if not data:
              raise SystemExit('Canonical catalog is empty')
          print('Canonical catalog is populated')
      - name: Verify canonical catalog counts
        run: |
          python - <<'PY'
          import json, os, urllib.request
          base=os.environ['SUPABASE_URL'].rstrip('/')
          key=os.environ['SUPABASE_ANON_KEY']
          url=base+'/rest/v1/vehicle_catalog_canonical?select=id&limit=1'
          req=urllib.request.Request(url,headers={'apikey':key,'Authorization':'Bearer '+key,'Prefer':'count=exact'})
          with urllib.request.urlopen(req,timeout=30) as r:
              total=r.headers.get('Content-Range','').split('/')[-1]
              print('Canonical catalog row count:', total)
              if not total.isdigit() or int(total) == 0:
                  raise SystemExit('Canonical catalog count verification failed')
          PY

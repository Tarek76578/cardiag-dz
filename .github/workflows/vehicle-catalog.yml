name: Vehicle Catalog Import

on:
  push:
    paths:
      - '.github/workflows/vehicle-catalog.yml'
      - 'tools/vehicle_catalog/import_engines_v2.py'
  workflow_dispatch:
    inputs:
      scope:
        description: 'Catalog scope'
        required: true
        default: 'all'
        type: choice
        options:
          - algeria-priority
          - all

permissions:
  contents: read

env:
  SUPABASE_URL: https://knripjpkmvdmqtstkcmo.supabase.co
  SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtucmlwanBrbXZkbXF0c3RrY21vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0MzA0MzMsImV4cCI6MjEwMzAwNjQzM30.1AKcbWMdzy0r2knTq0Ols8Oaw5zr2mTVaBjBqeAHWCY' }}

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Import complete canonical catalog
        env:
          CATALOG_SCOPE: ${{ inputs.scope || 'all' }}
        run: python tools/vehicle_catalog/import_engines_v2.py --scope "$CATALOG_SCOPE"
      - name: Verify canonical catalog through Supabase REST
        run: |
          python - <<'PY'
          import json, urllib.request
          base='https://knripjpkmvdmqtstkcmo.supabase.co'
          key='${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtucmlwanBrbXZkbXF0c3RrY21vIiwiaWF0IjoxNzg3NDMwNDMzLCJleHAiOjIxMDMwMDY0MzB9.1AKcbWMdzy0r2knTq0Ols8Oaw5zr2mTVaBjBqeAHWCY' }}'
          req=urllib.request.Request(base+'/rest/v1/vehicle_catalog_canonical?select=id&limit=1',headers={'apikey':key,'Authorization':'Bearer '+key})
          with urllib.request.urlopen(req,timeout=30) as r: data=json.load(r)
          if not data: raise SystemExit('Canonical catalog is empty')
          print('Canonical catalog is populated')
          PY

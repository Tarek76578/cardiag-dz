name: Vehicle Catalog Import

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate and preview changes without writing Supabase'
        required: true
        default: true
        type: boolean
      scope:
        description: 'Catalog scope'
        required: true
        default: 'algeria-priority'
        type: choice
        options:
          - algeria-priority
          - all

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download vehicle source data
        run: |
          mkdir -p .vehicle-data
          curl -fL --retry 5 --retry-delay 2 -o .vehicle-data/engines.csv https://raw.githubusercontent.com/gor3a/vehicle-makes-models/main/data/csv/engines.csv
          curl -fL --retry 5 --retry-delay 2 -o .vehicle-data/makes-models.csv https://raw.githubusercontent.com/gor3a/vehicle-makes-models/main/data/csv/makes-models.csv
          test -s .vehicle-data/engines.csv
          test -s .vehicle-data/makes-models.csv
          wc -l .vehicle-data/*.csv
      - name: Validate catalog pipeline
        env:
          CATALOG_SCOPE: ${{ inputs.scope }}
          DRY_RUN: ${{ inputs.dry_run }}
          VEHICLE_ENGINES_CSV: ${{ github.workspace }}/.vehicle-data/engines.csv
          VEHICLE_MAKES_MODELS_CSV: ${{ github.workspace }}/.vehicle-data/makes-models.csv
        run: python tools/vehicle_catalog/validate_catalog.py --scope "$CATALOG_SCOPE" --dry-run "$DRY_RUN"
      - name: Import year-specific engines into Supabase
        if: ${{ inputs.dry_run == false }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VEHICLE_ENGINES_CSV: ${{ github.workspace }}/.vehicle-data/engines.csv
          VEHICLE_MAKES_MODELS_CSV: ${{ github.workspace }}/.vehicle-data/makes-models.csv
          CATALOG_SCOPE: ${{ inputs.scope }}
        run: python tools/vehicle_catalog/import_engines.py --scope "$CATALOG_SCOPE"
      - name: Sync Wikimedia Commons vehicle images
        if: ${{ inputs.dry_run == false }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python tools/vehicle_catalog/sync_wikimedia_images.py

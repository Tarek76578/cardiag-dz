name: Vehicle Catalog Import

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate and preview changes without writing Supabase'
        required: true
        default: true
        type: boolean
      scope:
        description: 'Catalog scope'
        required: true
        default: 'algeria-priority'
        type: choice
        options:
          - algeria-priority
          - all

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate catalog pipeline
        env:
          CATALOG_SCOPE: ${{ inputs.scope }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python tools/vehicle_catalog/validate_catalog.py --scope "$CATALOG_SCOPE" --dry-run "$DRY_RUN"
      - name: Sync Wikimedia Commons vehicle images
        if: ${{ inputs.dry_run == false }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python tools/vehicle_catalog/sync_wikimedia_images.py

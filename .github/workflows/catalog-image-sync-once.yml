name: CarDiag Vehicle Image Sync

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type SYNC to import missing Wikimedia Commons images'
        required: true
        type: string
  push:
    paths:
      - 'tools/vehicle_catalog/catalog_sync_trigger.txt'

permissions:
  contents: read

jobs:
  sync:
    if: github.event_name == 'push' || inputs.confirm == 'SYNC'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate pipeline
        run: python tools/vehicle_catalog/validate_catalog.py --scope algeria-priority --dry-run false
      - name: Sync missing vehicle images
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python tools/vehicle_catalog/sync_wikimedia_images.py

name: CarDiag DZ Runtime

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cardiag-runtime-${{ github.ref }}
  cancel-in-progress: true

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

jobs:
  runtime:
    name: Android emulator smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;35.0.0"
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Make Gradle executable
        working-directory: android
        run: chmod +x ./gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Run emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          disk-size: 4096M
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            set -e
            adb wait-for-device
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -n 1)
            adb install -r "$APK"
            PACKAGE="dz.cardiag.app.debug"
            adb shell pm path "$PACKAGE"
            adb shell monkey -p "$PACKAGE" 1
            sleep 8
            adb shell dumpsys activity activities | grep -E "mResumedActivity|ResumedActivity" || true
            adb logcat -d -t 1000 > runtime-full-log.txt
            if grep -Eq "FATAL EXCEPTION|AndroidRuntime: FATAL" runtime-full-log.txt; then
              grep -E -A25 -B5 "FATAL EXCEPTION|AndroidRuntime: FATAL" runtime-full-log.txt || true
              exit 1
            fi
            adb exec-out screencap -p > cardiag-runtime.png

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cardiag-runtime-evidence
          path: |
            runtime-full-log.txt
            cardiag-runtime.png
          if-no-files-found: ignore
          retention-days: 14

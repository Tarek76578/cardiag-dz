name: CarDiag Agent

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cardiag-agent-main
  cancel-in-progress: false

env:
  OLLAMA_MODEL: qwen2.5-coder:7b
  OLLAMA_HOST: http://127.0.0.1:11434

jobs:
  agent:
    name: Autonomous engineering cycle
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify manual trigger and baseline
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF_NAME" = main
          test -f AGENTS.md
          test -f android/gradlew
          test -f android/app/build.gradle.kts
          git diff --check
          echo CARdiag_AGENT_TRIGGER_OK

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Setup Ollama
        run: |
          set -euo pipefail
          if ! command -v ollama >/dev/null 2>&1; then
            curl -fsSL https://ollama.com/install.sh | sh
          fi
          ollama --version
          nohup ollama serve >/tmp/ollama.log 2>&1 &
          echo $! >/tmp/ollama.pid
          for i in $(seq 1 60); do
            if curl -fsS "$OLLAMA_HOST/api/tags" >/tmp/ollama-tags.json 2>/dev/null; then
              echo OLLAMA_READY
              break
            fi
            sleep 2
          done
          curl -fsS "$OLLAMA_HOST/api/tags" >/tmp/ollama-tags.json
          if ! grep -q 'qwen2.5-coder' /tmp/ollama-tags.json; then
            ollama pull "$OLLAMA_MODEL"
          fi
          ollama list
          curl -fsS "$OLLAMA_HOST/api/chat" \
            -H 'Content-Type: application/json' \
            -d "{\"model\":\"$OLLAMA_MODEL\",\"messages\":[{\"role\":\"user\",\"content\":\"Reply exactly OLLAMA_READY\"}],\"stream\":false}" \
            >/tmp/ollama-probe.json
          grep -q 'OLLAMA_READY' /tmp/ollama-probe.json
          echo "AI_PROVIDER_SUCCESS=ollama/$OLLAMA_MODEL"

      - name: Cache Ollama model
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-${{ runner.os }}-${{ env.OLLAMA_MODEL }}-v1

      - name: Install Aider
        run: |
          set -euo pipefail
          python3 -m pip install --user --upgrade aider-chat
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/aider" --version

      - name: Run autonomous agent
        env:
          OLLAMA_API_BASE: http://127.0.0.1:11434
          OLLAMA_MODEL: qwen2.5-coder:7b
        run: |
          set -euo pipefail
          chmod +x scripts/autonomous-agent.sh
          ./scripts/autonomous-agent.sh

      - name: Validate Android output
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease bundleRelease --stacktrace

      - name: Final integrity check
        run: |
          set -euo pipefail
          git diff --check
          test -f AGENTS.md
          test -f android/app/build.gradle.kts
          git status --short

      - name: Commit verified improvements
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo 'No verified changes to commit.'
            exit 0
          fi
          git commit -m 'chore(agent): autonomous engineering cycle'
          git push origin HEAD:main

      - name: Upload results
        uses: actions/upload-artifact@v6
        with:
          name: cardiag-agent-results
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
            market-audit.md
            agent-state.md
          if-no-files-found: warn
          retention-days: 14

      - name: Stop Ollama
        if: always()
        run: |
          if [ -f /tmp/ollama.pid ]; then kill "$(cat /tmp/ollama.pid)" 2>/dev/null || true; fi

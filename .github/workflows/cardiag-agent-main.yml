name: CarDiag Agent

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cardiag-agent-main
  cancel-in-progress: false

env:
  AI_MODEL: openrouter/qwen/qwen3-coder:free

jobs:
  agent:
    name: Autonomous engineering cycle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify manual trigger and baseline
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF_NAME" = main
          test -f AGENTS.md
          test -f android/gradlew
          test -f android/app/build.gradle.kts
          git diff --check
          echo CARdiag_AGENT_TRIGGER_OK

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Verify OpenRouter access
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$OPENROUTER_API_KEY" || { echo 'Missing GitHub secret OPENROUTER_API_KEY' >&2; exit 12; }
          curl -fsS https://openrouter.ai/api/v1/models -H "Authorization: Bearer $OPENROUTER_API_KEY" >/tmp/openrouter-models.json
          python3 - <<'PY'
          import json
          target='qwen/qwen3-coder:free'
          data=json.load(open('/tmp/openrouter-models.json'))
          ids={m.get('id') for m in data.get('data', [])}
          if target not in ids:
              raise SystemExit(f'Required OpenRouter model is unavailable: {target}')
          print(f'OPENROUTER_MODEL_AVAILABLE={target}')
          PY
          echo OPENROUTER_READY

      - name: Install Aider
        run: |
          set -euo pipefail
          python3 -m pip install --user --upgrade aider-chat
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/aider" --version

      - name: Run autonomous agent
        timeout-minutes: 45
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AIDER_MODEL: ${{ env.AI_MODEL }}
        run: |
          set -euo pipefail
          chmod +x scripts/autonomous-agent.sh
          ./scripts/autonomous-agent.sh

      - name: Validate Android output
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease bundleRelease --stacktrace

      - name: Final integrity check
        run: |
          set -euo pipefail
          git diff --check
          test -f AGENTS.md
          test -f android/app/build.gradle.kts
          git status --short

      - name: Commit verified improvements
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo 'No verified changes to commit.'
            exit 0
          fi
          git commit -m 'chore(agent): autonomous engineering cycle'
          git push origin HEAD:main

      - name: Upload results
        uses: actions/upload-artifact@v6
        with:
          name: cardiag-agent-results
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
            market-audit.md
            agent-state.md
          if-no-files-found: warn
          retention-days: 14

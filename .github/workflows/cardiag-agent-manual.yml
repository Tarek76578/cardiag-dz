name: CarDiag Agent

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - .github/workflows/cardiag-agent-manual.yml

permissions:
  contents: write
  actions: write
  pull-requests: write
  issues: write

concurrency:
  group: cardiag-agent
  cancel-in-progress: false

jobs:
  agent:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.CARDIAG_WORKFLOW_TOKEN }}

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Verify credentials
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_TOKEN: ${{ secrets.CARDIAG_WORKFLOW_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$OPENROUTER_API_KEY"
          test -n "$GH_TOKEN"

      - name: Install Codex
        run: npm install -g @openai/codex

      - name: Autonomous engineering cycle
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_TOKEN: ${{ secrets.CARDIAG_WORKFLOW_TOKEN }}
          CODEX_HOME: ${{ github.workspace }}/.codex
        run: |
          set -euo pipefail
          mkdir -p "$CODEX_HOME"
          cat > "$CODEX_HOME/config.toml" <<'EOF'
model = "openrouter/free"
model_provider = "openrouter"
model_reasoning_effort = "high"
approval_policy = "never"
sandbox_mode = "danger-full-access"

[model_providers.openrouter]
name = "OpenRouter"
base_url = "https://openrouter.ai/api/v1"
env_key = "OPENROUTER_API_KEY"
EOF
          codex exec --full-auto --skip-git-repo-check "Act as the autonomous principal engineer, product engineer, QA engineer, security reviewer, and release engineer for CarDiag DZ. Read AGENTS.md and agent-state.md first. Inspect the entire repository and current CI. Improve the product toward production quality for the Algerian automotive market. Prioritize correctness, security, data integrity, reliability, UX, Arabic RTL and French localization, architecture, tests and CI. You may modify application code, resources, tests, Gradle and CI/CD. Never weaken tests, suppress real defects, fabricate automotive/pricing/service data, or expose secrets. Run real validation and inspect actual failures. Fix root causes. Update agent-state.md with evidence, completed work, blockers and next priorities. Commit coherent production-quality changes to main. Do not declare completion merely because a build is green; complete the highest-value actionable work for this cycle."

      - name: Final integrity check
        run: |
          set -euo pipefail
          git diff --check
          test -f AGENTS.md
          test -f agent-state.md

      - name: Commit and push
        env:
          GH_TOKEN: ${{ secrets.CARDIAG_WORKFLOW_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No changes produced by agent.'
            exit 0
          fi
          git add -A
          git commit -m 'chore(agent): autonomous engineering cycle'
          git fetch origin main
          git rebase origin/main
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git push origin HEAD:main

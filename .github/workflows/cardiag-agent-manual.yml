name: CarDiag Autonomous Agent

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cardiag-agent-manual
  cancel-in-progress: false

jobs:
  agent:
    name: Autonomous audit, engineering, test and release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Agent trigger validation
        run: |
          set -euo pipefail
          echo "AGENT_TRIGGER_OK"
          echo "event=${GITHUB_EVENT_NAME}"
          echo "sha=${GITHUB_SHA}"

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify repository instructions
        run: |
          set -euo pipefail
          test -f AGENTS.md
          test -f agent-state.md
          test -f android/gradlew
          test -f android/app/build.gradle.kts
          test -f android/app/src/main/AndroidManifest.xml
          git diff --check

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 platforms;android-36 build-tools;35.0.0'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Codex
        run: npm install -g @openai/codex

      - name: Verify AI credential
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: test -n "$OPENROUTER_API_KEY"

      - name: Deep research and autonomous engineering
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CODEX_HOME: ${{ github.workspace }}/.codex
        run: |
          set -euo pipefail
          mkdir -p "$CODEX_HOME" research
          cat > "$CODEX_HOME/config.toml" <<'EOF'
model = "openrouter/free"
model_provider = "openrouter"
approval_policy = "never"
sandbox_mode = "danger-full-access"

[model_providers.openrouter]
name = "OpenRouter"
base_url = "https://openrouter.ai/api/v1"
env_key = "OPENROUTER_API_KEY"
EOF
          cat > research/RESEARCH_BRIEF.md <<'EOF'
# CarDiag research requirements

The agent must perform fresh external research using public internet access available in the runner. Prefer primary/official sources and current 2026 information. Research at minimum:

- Android official quality, accessibility, adaptive UI, Compose testing and security guidance.
- Android Bluetooth/OBD-related platform constraints and current permissions.
- OBD-II / ELM327 diagnostic limitations and reputable technical references.
- Current competitor capabilities: Carista, OBDeleven, Torque and other major OBD apps.
- Algerian automotive market: brands/models actually common in Algeria, with current authoritative or reputable sources.
- Current Google Play policy/security requirements relevant to an automotive diagnostic app.

Record the sources, dates accessed, key facts and confidence in research/market-audit.md. Do not copy large passages and do not treat competitor marketing claims as technical proof.
EOF
          codex exec --full-auto --skip-git-repo-check "You are the sole autonomous principal engineer, product engineer, QA engineer, security reviewer, automotive-diagnostics software reviewer, researcher and release engineer for CarDiag DZ. This is a full deep-audit-and-engineering run, not a superficial code cleanup.

FIRST: read AGENTS.md, agent-state.md and research/RESEARCH_BRIEF.md. Inspect the entire repository, Android project, resources, tests, Supabase integration, vehicle catalog tooling, diagnostics/OBD implementation, Gradle configuration, manifests, CI configuration and existing artifacts. Establish a factual baseline before changing anything.

SECOND: perform fresh external research from public sources available from the runner. Prefer official Android/Google documentation and authoritative automotive/OBD references, then reputable competitor documentation and current Algerian market sources. Save a concise evidence-based research report to market-audit.md. Every important external claim must have its source URL and access date. Never fabricate facts, vehicle specifications, DTC meanings, repair procedures, prices, service availability or test results.

THIRD: perform a comprehensive product audit covering: build reproducibility; Kotlin/Compose architecture; navigation/state; crashes and error handling; offline behavior; authentication/session behavior; Supabase/RLS/data security; secrets; OBD/Bluetooth permissions and lifecycle; ELM327 protocol handling; DTC decoding/correlation safety; live-data validation; VIN handling; vehicle catalog correctness; Arabic RTL; French localization; typography; accessibility; contrast; touch targets; adaptive layouts; loading/empty/error states; performance; battery; privacy; analytics; dependency freshness; Gradle; unit/instrumentation/UI tests; runtime/emulator coverage; release signing; Play readiness; and user-facing UX. Compare the findings against the researched competitor baseline and the Algerian market.

FOURTH: prioritize findings by severity and user/business impact. Then IMPLEMENT the highest-value verified improvements that fit safely in this run. Do not make cosmetic changes merely to create a diff. Do not delete or weaken tests. Do not silently suppress warnings. Do not invent automotive knowledge. For safety-critical diagnostic behavior, prefer explicit uncertainty and evidence over confident guesses.

FIFTH: run real validation. Use ./gradlew for unit tests, lint and debug/release builds as appropriate. Add or improve tests for every non-trivial behavior you change. If a validation fails, diagnose the root cause and fix it. If an emulator/runtime test is feasible in this runner, run it; otherwise document the exact blocker.

SIXTH: update agent-state.md with: audit date; evidence; research sources; findings by severity; changes made; tests run and exact results; unresolved blockers; and next priorities. Also keep market-audit.md current.

Do not claim the product is complete unless the evidence supports that claim. Work autonomously for the full run, but stay within the repository and its declared product scope. Do not create another workflow or another autonomous agent. Do not modify GitHub secrets. Do not commit credentials. Leave the workspace ready for the final CI validation and release steps."

      - name: Validate and build CarDiag
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --version
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease bundleRelease --stacktrace

      - name: Final repository integrity check
        run: |
          set -euo pipefail
          git diff --check
          test -f AGENTS.md
          test -f agent-state.md
          test -f market-audit.md
          if git grep -nE '-----BEGIN (RSA|OPENSSH|EC|DSA|PRIVATE) KEY-----|AIza[0-9A-Za-z_-]{30,}|\bsk-[A-Za-z0-9_-]{30,}\b' -- ':!*.md' ':!.github/workflows/*'; then
            echo 'Potential committed secret detected'
            exit 1
          fi

      - name: Commit verified autonomous changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes produced by this run.'
            exit 0
          fi
          git commit -m 'chore(agent): deep audit and autonomous engineering'
          git push origin HEAD:main

      - name: Upload release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: cardiag-autonomous-release
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
            market-audit.md
            agent-state.md
          if-no-files-found: error
          retention-days: 14
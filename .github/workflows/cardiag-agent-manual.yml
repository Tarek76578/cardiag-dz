name: CarDiag Agent

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  agent-trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Agent trigger validation
        run: |
          set -euo pipefail
          echo "AGENT_TRIGGER_OK"
          echo "event=${{ github.event_name }}"
          echo "sha=${{ github.sha }}"

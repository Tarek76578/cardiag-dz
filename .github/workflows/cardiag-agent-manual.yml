name: CarDiag Autonomous Agent

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cardiag-autonomous-agent
  cancel-in-progress: false

jobs:
  agent:
    name: Deep audit and autonomous engineering
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Agent trigger validation
        run: |
          set -euo pipefail
          echo "AGENT_TRIGGER_OK"
          echo "event=${GITHUB_EVENT_NAME}"
          echo "sha=${GITHUB_SHA}"

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify repository
        run: |
          set -euo pipefail
          test -f AGENTS.md
          test -f agent-state.md
          test -f android/gradlew
          test -f android/app/build.gradle.kts
          git diff --check

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 platforms;android-36 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Codex
        run: npm install -g @openai/codex

      - name: Verify AI credential
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: test -n "$OPENROUTER_API_KEY"

      - name: Deep audit research and engineering
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CODEX_HOME: ${{ github.workspace }}/.codex
        run: |
          set -euo pipefail
          mkdir -p "$CODEX_HOME"
          cat > "$CODEX_HOME/config.toml" <<'EOF'
model = "openrouter/free"
model_provider = "openrouter"
approval_policy = "never"
sandbox_mode = "danger-full-access"

[model_providers.openrouter]
name = "OpenRouter"
base_url = "https://openrouter.ai/api/v1"
env_key = "OPENROUTER_API_KEY"
EOF
          codex exec --full-auto --skip-git-repo-check "You are the sole autonomous principal engineer, QA engineer, security reviewer, automotive diagnostics software reviewer, researcher and release engineer for CarDiag DZ. Read AGENTS.md and agent-state.md first. Inspect the entire repository before making changes.

Perform a deep evidence-based audit of the whole product: Android/Kotlin/Compose architecture, navigation and state, crashes and error handling, offline behavior, authentication and Supabase/RLS security, secrets, Bluetooth/OBD permissions and lifecycle, ELM327 protocol handling, VIN/DTC/live-data behavior, vehicle catalog correctness, Arabic RTL, French localization, accessibility, contrast, touch targets, adaptive layouts, loading/empty/error states, performance, battery, privacy, dependencies, Gradle, unit/instrumentation/UI tests, emulator/runtime coverage, release signing, Play readiness, CI/CD and documentation.

Also perform fresh external research using public sources available in the runner. Prefer official Android/Google documentation and authoritative OBD/automotive references, then reputable competitor documentation and current Algerian automotive-market sources. Compare CarDiag with major OBD products such as Carista, OBDeleven and Torque. Record source URLs and access dates in market-audit.md. Never fabricate vehicle specifications, DTC meanings, repair procedures, prices, services, test results or market facts.

After the audit, rank findings by severity and impact. Implement the highest-value verified improvements that can be safely completed in this run. Add or improve tests for non-trivial changes. Never weaken/delete tests or suppress real defects. Run real Gradle validation and diagnose failures at their root. If runtime/emulator validation is not available, document the exact blocker.

Update agent-state.md with the audit date, evidence, research sources, findings, changes, exact validation results, unresolved blockers and next priorities. Keep market-audit.md current. Do not create another workflow or autonomous agent. Do not modify GitHub secrets. Do not commit credentials. Work autonomously and leave the repository in a verified state."

      - name: Validate Android project
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease bundleRelease --stacktrace

      - name: Final integrity check
        run: |
          set -euo pipefail
          git diff --check
          test -f AGENTS.md
          test -f agent-state.md
          test -f market-audit.md

      - name: Commit autonomous changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes produced by this run.'
            exit 0
          fi
          git commit -m 'chore(agent): deep audit and autonomous engineering'
          git push origin HEAD:main

      - name: Upload audit and release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: cardiag-autonomous-release
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
            market-audit.md
            agent-state.md
          if-no-files-found: error
          retention-days: 14

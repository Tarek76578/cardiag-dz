name: CarDiag Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cardiag-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Release APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;35.0.0"
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
      - name: Make Gradle executable
        working-directory: android
        run: chmod +x ./gradlew
      - name: Assemble release APK and AAB
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease bundleRelease --stacktrace
      - name: Upload release APK
        uses: actions/upload-artifact@v6
        with:
          name: cardiag-dz-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload release AAB
        uses: actions/upload-artifact@v6
        with:
          name: cardiag-dz-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

name: CarDiag Autonomous Agent (Groq)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cardiag-autonomous-agent
  cancel-in-progress: false

env:
  GROQ_BASE_URL: https://api.groq.com/openai/v1
  GROQ_WIRE_API: responses

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Repair and normalize git state
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git reset --hard origin/main
          git clean -fdx

      - name: Baseline
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = main
          test -f AGENTS.md
          test -f android/gradlew
          test -f android/app/build.gradle.kts
          test -f docs/agent-next-task.md
          test -f scripts/autonomous-agent.sh
          test -n "${{ secrets.GROQ_API_KEY }}"
          test -z "$(git status --porcelain)"

      - name: Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Android
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Codex CLI
        run: |
          set -euo pipefail
          rm -rf /tmp/codex-cli
          npm install --prefix /tmp/codex-cli --no-save @openai/codex
          echo "/tmp/codex-cli/node_modules/.bin" >> "$GITHUB_PATH"
          /tmp/codex-cli/node_modules/.bin/codex --version

      - name: Discover and probe Groq Responses models
        id: provider
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail
          body="$(curl -sS --max-time 20 -w '\n%{http_code}' \
            -H "Authorization: Bearer $GROQ_API_KEY" \
            -H 'Content-Type: application/json' \
            "$GROQ_BASE_URL/models")" || exit 40
          http_code="$(printf '%s\n' "$body" | tail -n1)"
          response="$(printf '%s\n' "$body" | sed '$d')"
          case "$http_code" in
            200) ;;
            401|403) echo "GROQ_API_AUTH_FAILED_HTTP=$http_code"; exit 41 ;;
            429) echo 'GROQ_API_RATE_LIMITED=1'; exit 75 ;;
            *) echo "GROQ_PREFLIGHT_HTTP=$http_code"; printf '%s\n' "$response" | head -c 1000; exit 42 ;;
          esac

          MODEL_LIST="$response" python3 <<'PY' > /tmp/groq-candidates.txt
          import json, os
          data=json.loads(os.environ["MODEL_LIST"])
          models=data.get("data",[])
          blocked=("whisper","tts","guard","safeguard","compound")
          preferred=("qwen/","moonshotai/","meta-llama/","llama-","openai/gpt-oss")
          rows=[]
          for m in models:
              mid=m.get("id","")
              if not mid or any(x in mid.lower() for x in blocked): continue
              ctx=m.get("context_window",0) or 0
              rows.append((0 if mid.startswith(preferred) else 1,-ctx,mid))
          for _,__,mid in sorted(rows): print(mid)
          PY

          echo '=== GROQ MODELS EXPOSED TO THIS KEY ==='
          cat /tmp/groq-candidates.txt

          selected=''
          while IFS= read -r model; do
            [ -n "$model" ] || continue
            echo "=== REAL GROQ RESPONSES PROBE: $model ==="
            payload="$(MODEL="$model" python3 - <<'PY'
          import json,os
          print(json.dumps({"model":os.environ["MODEL"],"input":"Reply with exactly OK","max_output_tokens":16,"store":False}))
          PY
            )"
            probe="$(curl -sS --max-time 30 -w '\n%{http_code}' \
              -H "Authorization: Bearer $GROQ_API_KEY" \
              -H 'Content-Type: application/json' \
              -d "$payload" \
              "$GROQ_BASE_URL/responses")" || true
            code="$(printf '%s\n' "$probe" | tail -n1)"
            resp="$(printf '%s\n' "$probe" | sed '$d')"
            echo "GROQ_RESPONSES_PROBE_HTTP=$code MODEL=$model"
            if [ "$code" = 200 ]; then
              RESPONSE_BODY="$resp" python3 - <<'PY'
          import json, os
          data=json.loads(os.environ["RESPONSE_BODY"])
          if not data.get("id") or data.get("object") not in ("response", "response.completed"):
              raise SystemExit("GROQ_RESPONSES_PROBE_INVALID_JSON=1")
          print("GROQ_RESPONSES_PROBE_VALID_JSON=1")
          PY
              selected="$model"
              break
            fi
            if [ "$code" = 429 ]; then echo "GROQ_RESPONSES_PROBE_429_MODEL=$model"; fi
          done < /tmp/groq-candidates.txt

          test -n "$selected" || { echo 'GROQ_NO_RESPONSES_MODEL_PASSED_REAL_INFERENCE=1' >&2; exit 43; }
          echo "GROQ_RESPONSES_MODEL_SELECTED=$selected"
          {
            echo 'provider=groq'
            echo "model=$selected"
            echo "base_url=$GROQ_BASE_URL"
            echo 'env_key=GROQ_API_KEY'
            echo 'wire_api=responses'
          } >> "$GITHUB_OUTPUT"

      - name: Start Codex payload capture proxy outside repository
        run: |
          set -euo pipefail
          rm -f /tmp/codex-groq-request.json /tmp/codex-groq-proxy.log /tmp/codex-agent.log
          cp scripts/codex-groq-capture-proxy.py /tmp/codex-groq-capture-proxy.py
          chmod +x /tmp/codex-groq-capture-proxy.py
          nohup python3 /tmp/codex-groq-capture-proxy.py > /tmp/codex-groq-proxy.log 2>&1 &
          echo $! > /tmp/codex-groq-proxy.pid
          for i in $(seq 1 30); do
            if grep -q 'CAPTURE_PROXY_LISTENING=' /tmp/codex-groq-proxy.log; then break; fi
            sleep 1
          done
          grep 'CAPTURE_PROXY_LISTENING=' /tmp/codex-groq-proxy.log
          test -z "$(git status --porcelain)"

      - name: Autonomous Codex agent through capture proxy
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CODEX_PROVIDER: ${{ steps.provider.outputs.provider }}
          AI_PROVIDER: ${{ steps.provider.outputs.provider }}
          AI_MODEL: ${{ steps.provider.outputs.model }}
          CODEX_BASE_URL: http://127.0.0.1:8787/openai/v1
          CODEX_ENV_KEY: ${{ steps.provider.outputs.env_key }}
          CODEX_WIRE_API: ${{ steps.provider.outputs.wire_api }}
        run: |
          set -euo pipefail
          chmod +x scripts/autonomous-agent.sh
          export CODEX_HOME="$HOME/.codex-cardiag"
          mkdir -p "$CODEX_HOME"
          set +e
          ./scripts/autonomous-agent.sh 2>&1 | tee /tmp/codex-agent.log
          agent_status=${PIPESTATUS[0]}
          set -e
          echo '=== CAPTURE PROXY LOG ==='
          cat /tmp/codex-groq-proxy.log || true
          if [ "$agent_status" -eq 0 ]; then exit 0; fi
          if grep -qiE '429 Too Many Requests|rate.?limit|Rate limit exceeded|RESOURCE_EXHAUSTED' /tmp/codex-agent.log; then
            echo "AI_PROVIDER_RATE_LIMITED=groq"
            exit 75
          fi
          echo "AI_PROVIDER_FAILED=groq status=$agent_status"
          exit "$agent_status"

      - name: Upload captured Codex request for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-groq-payload-debug
          path: |
            /tmp/codex-groq-request.json
            /tmp/codex-groq-proxy.log
            /tmp/codex-agent.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Final validation
        if: success()
        working-directory: android
        run: timeout 600s ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease bundleRelease --stacktrace

      - name: Commit verified autonomous changes
        if: success()
        run: |
          set -euo pipefail
          git diff --check
          if [ -z "$(git status --porcelain)" ]; then
            echo "No autonomous changes to commit"
            exit 32
          fi
          git add -A
          git diff --cached --check
          git commit -m "feat: advance autonomous CarDiag milestone"
          git push origin HEAD:main

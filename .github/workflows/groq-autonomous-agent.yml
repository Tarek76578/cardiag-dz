name: CarDiag Autonomous Agent (Groq)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cardiag-autonomous-agent
  cancel-in-progress: false

env:
  GROQ_BASE_URL: https://api.groq.com/openai/v1
  GROQ_WIRE_API: responses
  GROQ_PRIMARY_MODEL: openai/gpt-oss-120b
  GROQ_FALLBACK_MODEL: openai/gpt-oss-20b
  GROQ_RATE_LIMIT_RETRIES: '2'
  GROQ_DEFAULT_RETRY_SECONDS: '45'
  GROQ_MAX_OUTPUT_TOKENS: '800'
  GROQ_MAX_INPUT_TOKENS: '4000'
  GROQ_TPM_LIMIT: '8000'
  GROQ_TPM_SAFETY_MARGIN: '1000'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Repair and normalize git state
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git reset --hard origin/main
          git clean -fdx
      - name: Baseline
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = main
          test -f AGENTS.md
          test -f android/gradlew
          test -f android/app/build.gradle.kts
          test -f docs/agent-next-task.md
          test -f agent-state.md
          test -f scripts/autonomous-agent.sh
          test -f scripts/codex-groq-capture-proxy.py
          test -f scripts/test_codex_groq_proxy.py
          test -n "${{ secrets.GROQ_API_KEY }}"
          test -z "$(git status --porcelain)"
      - name: Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Android
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true
      - name: Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install Codex CLI
        run: |
          set -euo pipefail
          rm -rf /tmp/codex-cli
          npm install --prefix /tmp/codex-cli --no-save @openai/codex
          echo "/tmp/codex-cli/node_modules/.bin" >> "$GITHUB_PATH"
          /tmp/codex-cli/node_modules/.bin/codex --version
      - name: Static and proxy regression gate
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/codex-groq-capture-proxy.py scripts/test_codex_groq_proxy.py
          python3 scripts/test_codex_groq_proxy.py
          git diff --check
          find scripts -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          test -z "$(git status --porcelain)"
      - name: Discover and probe Groq Responses models
        id: provider
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail
          body="$(curl -sS --max-time 20 -w '\n%{http_code}' -H "Authorization: Bearer $GROQ_API_KEY" -H 'Content-Type: application/json' "$GROQ_BASE_URL/models")" || exit 40
          http_code="$(printf '%s\n' "$body" | tail -n1)"
          response="$(printf '%s\n' "$body" | sed '$d')"
          case "$http_code" in
            200) ;;
            401|403) echo "GROQ_API_AUTH_FAILED_HTTP=$http_code"; exit 41 ;;
            429) echo 'GROQ_API_RATE_LIMITED=1'; exit 75 ;;
            *) echo "GROQ_PREFLIGHT_HTTP=$http_code"; printf '%s\n' "$response" | head -c 1000; exit 42 ;;
          esac
          MODEL_LIST="$response" python3 <<'PY' > /tmp/groq-candidates.txt
          import json, os
          data=json.loads(os.environ["MODEL_LIST"])
          models=data.get("data",[])
          blocked=("whisper","tts","guard","safeguard")
          ids={m.get("id",""):m for m in models}
          preferred=["openai/gpt-oss-120b", "openai/gpt-oss-20b"]
          for mid in preferred:
              if mid in ids: print(mid)
          rows=[]
          for m in models:
              mid=m.get("id","")
              if not mid or mid in preferred or any(x in mid.lower() for x in blocked): continue
              ctx=m.get("context_window",0) or 0
              rows.append((0 if mid.startswith(("openai/gpt-oss", "qwen/", "moonshotai/", "meta-llama/", "llama-")) else 1,-ctx,mid))
          for _,__,mid in sorted(rows): print(mid)
          PY
          cat /tmp/groq-candidates.txt
          selected=''
          while IFS= read -r model; do
            [ -n "$model" ] || continue
            payload="$(MODEL="$model" python3 - <<'PY'
          import json,os
          print(json.dumps({"model":os.environ["MODEL"],"input":"Reply with exactly OK","max_output_tokens":16}))
          PY
            )"
            probe="$(curl -sS --max-time 30 -w '\n%{http_code}' -H "Authorization: Bearer $GROQ_API_KEY" -H 'Content-Type: application/json' -d "$payload" "$GROQ_BASE_URL/responses")" || true
            code="$(printf '%s\n' "$probe" | tail -n1)"
            echo "GROQ_RESPONSES_PROBE_HTTP=$code MODEL=$model"
            if [ "$code" = 200 ]; then selected="$model"; break; fi
          done < /tmp/groq-candidates.txt
          test -n "$selected" || exit 43
          {
            echo 'provider=groq'; echo "model=$selected"; echo "fallback_model=$GROQ_FALLBACK_MODEL"; echo "base_url=$GROQ_BASE_URL"; echo 'env_key=GROQ_API_KEY'; echo 'wire_api=responses'
          } >> "$GITHUB_OUTPUT"
      - name: Start Groq compatibility adapter outside repository
        env:
          GROQ_PRIMARY_MODEL: ${{ steps.provider.outputs.model }}
          GROQ_FALLBACK_MODEL: ${{ env.GROQ_FALLBACK_MODEL }}
          GROQ_RATE_LIMIT_RETRIES: ${{ env.GROQ_RATE_LIMIT_RETRIES }}
          GROQ_DEFAULT_RETRY_SECONDS: ${{ env.GROQ_DEFAULT_RETRY_SECONDS }}
          GROQ_MAX_OUTPUT_TOKENS: ${{ env.GROQ_MAX_OUTPUT_TOKENS }}
          GROQ_MAX_INPUT_TOKENS: ${{ env.GROQ_MAX_INPUT_TOKENS }}
          GROQ_TPM_LIMIT: ${{ env.GROQ_TPM_LIMIT }}
          GROQ_TPM_SAFETY_MARGIN: ${{ env.GROQ_TPM_SAFETY_MARGIN }}
        run: |
          set -euo pipefail
          rm -f /tmp/codex-groq-request.json /tmp/codex-groq-adapted-request.json /tmp/codex-groq-response.json /tmp/codex-groq-proxy.log /tmp/codex-agent.log
          cp scripts/codex-groq-capture-proxy.py /tmp/codex-groq-capture-proxy.py
          chmod +x /tmp/codex-groq-capture-proxy.py
          python3 -m py_compile /tmp/codex-groq-capture-proxy.py
          nohup env GROQ_PRIMARY_MODEL="$GROQ_PRIMARY_MODEL" GROQ_FALLBACK_MODEL="$GROQ_FALLBACK_MODEL" GROQ_RATE_LIMIT_RETRIES="$GROQ_RATE_LIMIT_RETRIES" GROQ_DEFAULT_RETRY_SECONDS="$GROQ_DEFAULT_RETRY_SECONDS" GROQ_MAX_OUTPUT_TOKENS="$GROQ_MAX_OUTPUT_TOKENS" GROQ_MAX_INPUT_TOKENS="$GROQ_MAX_INPUT_TOKENS" GROQ_TPM_LIMIT="$GROQ_TPM_LIMIT" GROQ_TPM_SAFETY_MARGIN="$GROQ_TPM_SAFETY_MARGIN" python3 /tmp/codex-groq-capture-proxy.py > /tmp/codex-groq-proxy.log 2>&1 &
          echo $! > /tmp/codex-groq-proxy.pid
          for i in $(seq 1 30); do grep -q 'CAPTURE_PROXY_LISTENING=' /tmp/codex-groq-proxy.log && break; sleep 1; done
          grep 'CAPTURE_PROXY_LISTENING=' /tmp/codex-groq-proxy.log
          test -z "$(git status --porcelain)"
      - name: Autonomous Codex agent through Groq compatibility adapter
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CODEX_PROVIDER: ${{ steps.provider.outputs.provider }}
          AI_PROVIDER: ${{ steps.provider.outputs.provider }}
          AI_MODEL: ${{ steps.provider.outputs.model }}
          CODEX_BASE_URL: http://127.0.0.1:8787/openai/v1
          CODEX_ENV_KEY: ${{ steps.provider.outputs.env_key }}
          CODEX_WIRE_API: ${{ steps.provider.outputs.wire_api }}
        run: |
          set -euo pipefail
          chmod +x scripts/autonomous-agent.sh
          export CODEX_HOME="$HOME/.codex-cardiag"
          mkdir -p "$CODEX_HOME"
          set +e
          ./scripts/autonomous-agent.sh 2>&1 | tee /tmp/codex-agent.log
          agent_status=${PIPESTATUS[0]}
          set -e
          cat /tmp/codex-groq-proxy.log || true
          if [ "$agent_status" -eq 0 ]; then exit 0; fi
          if grep -qiE '429 Too Many Requests|rate.?limit|Rate limit exceeded|RESOURCE_EXHAUSTED' /tmp/codex-agent.log; then exit 75; fi
          exit "$agent_status"
      - name: Upload Groq compatibility diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-groq-compatibility-debug
          path: |
            /tmp/codex-groq-request.json
            /tmp/codex-groq-adapted-request.json
            /tmp/codex-groq-response.json
            /tmp/codex-groq-proxy.log
            /tmp/codex-agent.log
          if-no-files-found: ignore
          retention-days: 3
      - name: Final validation
        if: success()
        working-directory: android
        run: timeout 600s ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease bundleRelease --stacktrace
      - name: Commit verified autonomous changes
        if: success()
        run: |
          set -euo pipefail
          git diff --check
          if [ -z "$(git status --porcelain)" ]; then echo "No autonomous changes to commit"; exit 32; fi
          git add -A
          git diff --cached --check
          git commit -m "feat: advance autonomous CarDiag milestone"
          git push origin HEAD:main

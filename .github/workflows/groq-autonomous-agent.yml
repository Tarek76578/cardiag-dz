name: CarDiag Autonomous Agent (OpenRouter)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cardiag-autonomous-agent
  cancel-in-progress: false

env:
  OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
  OPENROUTER_WIRE_API: responses
  OPENROUTER_PRIMARY_MODEL: openai/gpt-oss-120b:free
  OPENROUTER_FALLBACK_MODEL: openai/gpt-oss-20b:free
  OPENROUTER_RATE_LIMIT_RETRIES: '3'
  OPENROUTER_DEFAULT_RETRY_SECONDS: '30'
  OPENROUTER_MAX_OUTPUT_TOKENS: '1200'
  OPENROUTER_MAX_INPUT_TOKENS: '6000'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Repair and normalize git state
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git reset --hard origin/main
          git clean -fdx
      - name: Baseline
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = main
          test -f AGENTS.md
          test -x android/gradlew
          test -f android/app/build.gradle.kts
          test -f docs/agent-next-task.md
          test -f agent-state.md
          test -x scripts/autonomous-agent.sh
          test -n "${{ secrets.OPEN_ROUTER_API_KEY }}"
          test -z "$(git status --porcelain)"
      - name: Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Android
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true
      - name: Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install Codex CLI
        run: |
          set -euo pipefail
          rm -rf /tmp/codex-cli
          npm install --prefix /tmp/codex-cli --no-save @openai/codex
          echo "/tmp/codex-cli/node_modules/.bin" >> "$GITHUB_PATH"
          /tmp/codex-cli/node_modules/.bin/codex --version
      - name: OpenRouter preflight
        id: provider
        env:
          OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
        run: |
          set -euo pipefail
          response_file=/tmp/openrouter-models.json
          code_file=/tmp/openrouter-models.http
          curl -sS --max-time 20 -o "$response_file" -w '%{http_code}' \
            -H "Authorization: Bearer $OPEN_ROUTER_API_KEY" \
            -H 'Content-Type: application/json' \
            "$OPENROUTER_BASE_URL/models" > "$code_file" || exit 40
          http_code="$(cat "$code_file")"
          case "$http_code" in
            200) ;;
            401|403) echo "OPENROUTER_API_AUTH_FAILED_HTTP=$http_code"; exit 41 ;;
            429) echo 'OPENROUTER_RATE_LIMITED=1'; exit 75 ;;
            *) echo "OPENROUTER_PREFLIGHT_HTTP=$http_code"; head -c 1000 "$response_file"; exit 42 ;;
          esac
          python3 - "$response_file" <<'PY' > /tmp/openrouter-candidates.txt
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as f:
              data=json.load(f)
          models=data.get("data",[])
          preferred=[
              "openai/gpt-oss-120b:free",
              "openai/gpt-oss-20b:free",
              "qwen/qwen3-coder:free",
              "deepseek/deepseek-chat-v3.1:free",
          ]
          ids={m.get("id",""):m for m in models}
          for mid in preferred:
              if mid in ids:
                  print(mid)
          for m in models:
              mid=m.get("id","")
              if not mid or mid in preferred or not mid.endswith(":free"):
                  continue
              ctx=m.get("context_length",0) or 0
              if ctx >= 8000:
                  print(mid)
          PY
          selected=''
          while IFS= read -r model; do
            [ -n "$model" ] || continue
            payload="$(MODEL="$model" python3 - <<'PY'
          import json,os
          print(json.dumps({"model":os.environ["MODEL"],"input":"Reply with exactly OK","max_output_tokens":16}))
          PY
            )"
            probe="$(curl -sS --max-time 30 -w '\n%{http_code}' \
              -H "Authorization: Bearer $OPEN_ROUTER_API_KEY" \
              -H 'Content-Type: application/json' \
              -H 'HTTP-Referer: https://github.com/Tarek76578/cardiag-dz' \
              -H 'X-Title: CarDiag Autonomous Agent' \
              -d "$payload" "$OPENROUTER_BASE_URL/responses")" || true
            code="$(printf '%s\n' "$probe" | tail -n1)"
            echo "OPENROUTER_RESPONSES_PROBE_HTTP=$code MODEL=$model"
            if [ "$code" = 200 ]; then selected="$model"; break; fi
          done < /tmp/openrouter-candidates.txt
          test -n "$selected" || exit 43
          echo "model=$selected" >> "$GITHUB_OUTPUT"
      - name: Run Codex with OpenRouter
        env:
          OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
          OPENROUTER_PRIMARY_MODEL: ${{ steps.provider.outputs.model }}
          OPENROUTER_FALLBACK_MODEL: ${{ env.OPENROUTER_FALLBACK_MODEL }}
          OPENROUTER_RATE_LIMIT_RETRIES: ${{ env.OPENROUTER_RATE_LIMIT_RETRIES }}
          OPENROUTER_DEFAULT_RETRY_SECONDS: ${{ env.OPENROUTER_DEFAULT_RETRY_SECONDS }}
          OPENROUTER_MAX_OUTPUT_TOKENS: ${{ env.OPENROUTER_MAX_OUTPUT_TOKENS }}
          OPENROUTER_MAX_INPUT_TOKENS: ${{ env.OPENROUTER_MAX_INPUT_TOKENS }}
          CODEX_PROVIDER: openrouter
          AI_PROVIDER: openrouter
          AI_MODEL: ${{ steps.provider.outputs.model }}
          CODEX_BASE_URL: https://openrouter.ai/api/v1
          CODEX_ENV_KEY: OPEN_ROUTER_API_KEY
          CODEX_WIRE_API: responses
        run: |
          set -euo pipefail
          export CODEX_HOME="$HOME/.codex-cardiag"
          mkdir -p "$CODEX_HOME"
          ./scripts/autonomous-agent.sh 2>&1 | tee /tmp/codex-agent.log
      - name: Final validation
        if: success()
        working-directory: android
        run: timeout 600s ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease bundleRelease --stacktrace
      - name: Commit verified autonomous changes
        if: success()
        run: |
          set -euo pipefail
          git diff --check
          if [ -z "$(git status --porcelain)" ]; then echo "No autonomous changes to commit"; exit 32; fi
          git add -A
          git diff --cached --check
          git commit -m "feat: advance autonomous CarDiag milestone"
          git push origin HEAD:main

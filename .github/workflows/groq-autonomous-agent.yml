name: CarDiag Autonomous Agent (Continuous)

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

permissions:
  contents: write
  issues: read

concurrency:
  group: cardiag-autonomous-agent
  cancel-in-progress: false

env:
  OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
  OPENROUTER_WIRE_API: responses
  AI_GATEWAY_MAX_OUTPUT_TOKENS: '8000'
  AI_GATEWAY_PROVIDER_ORDER: openrouter,groq,deepseek
  AI_AGENT_MAX_CYCLES: '12'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - name: Preserve continuation state
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git checkout -B main origin/main
          git clean -fdx -e .codex/
      - name: Baseline
        env:
          OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = main
          test -f AGENTS.md && test -x android/gradlew && test -f android/app/build.gradle.kts
          test -f docs/agent-next-task.md && test -f agent-state.md
          test -x scripts/autonomous-agent.sh && test -f scripts/ai-gateway.py
          test -n "${OPEN_ROUTER_API_KEY}${GROQ_API_KEY}${DEEPSEEK_API_KEY}"
          test -z "$(git status --porcelain)"
          python3 -m py_compile scripts/ai-gateway.py
          bash -n scripts/autonomous-agent.sh
      - name: Java
        uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17', cache: gradle}
      - name: Android
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true
      - name: Node
        uses: actions/setup-node@v5
        with: {node-version: '22', package-manager-cache: false}
      - name: Install Codex CLI
        run: |
          set -euo pipefail
          npm install --global --no-audit --no-fund @openai/codex@0.151.0
          codex --version
      - name: Bind Codex to current repository task
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/autonomous-agent.sh')
          s = p.read_text(encoding='utf-8')
          start = s.index('cat >"$PROMPT" <<\'EOF\'')
          end = s.index('\nEOF\n\nnext_candidate', start)
          block = '''cat >"$PROMPT" <<EOF
You are the CarDiag continuous implementation agent.

CURRENT TASK SPECIFICATION:
$(cat docs/agent-next-task.md)

Persistent state: ROOT/agent-state.md. Read it first, then inspect the current working tree.
This is a continuation task. Preserve intentional existing changes; never reset, discard, clean, or overwrite prior work merely to start fresh.
Implement ONLY the current task specification. Do not silently expand scope to unrelated CarDiag features.
Treat the task specification as authoritative and verify claims in code/tests yourself.
Prefer the smallest complete production-quality change and focused tests. Avoid broad repository exploration unrelated to the current task.
Run relevant tests/lint/build, fix real failures, and review the diff.
Update ROOT/agent-state.md with factual evidence: completed work, files changed, validation performed, remaining work, and the next concrete action.
If the current task is complete, update docs/agent-next-task.md to the next concrete unfinished milestone and record the completed milestone in agent-state.md. Never claim unfinished work is complete.
Do not commit or push; the workflow handles verified commits.
Stop after the current task is genuinely complete or after recording a precise blocker.
EOF'''
          p.write_text(s[:start] + block + s[end + 4:], encoding='utf-8')
          PY
          bash -n scripts/autonomous-agent.sh
      - name: Run continuous agent loop
        id: agent
        continue-on-error: true
        env:
          OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          CARDIAG_GATEWAY_KEY: local-gateway-key
          CODEX_PROVIDER: cardiag_gateway
          CODEX_BASE_URL: http://127.0.0.1:8787/v1
          CODEX_ENV_KEY: CARDIAG_GATEWAY_KEY
          CODEX_WIRE_API: responses
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export CODEX_HOME="$HOME/.codex-cardiag"
          mkdir -p "$CODEX_HOME"
          ./scripts/autonomous-agent.sh 2>&1 | tee /tmp/codex-agent.log
      - name: Persist checkpoint
        if: always()
        run: |
          set -euo pipefail
          git diff --check
          if [ -z "$(git status --porcelain)" ]; then
            echo 'No checkpoint changes to persist'
            exit 0
          fi
          git add -A
          git diff --cached --check
          git commit -m 'chore: persist autonomous agent checkpoint'
          git push origin HEAD:main
      - name: Stop after failed agent cycle
        if: steps.agent.outcome != 'success'
        run: |
          echo 'Agent cycle failed; checkpoint was persisted. The next scheduled run will continue from the committed state.'
          exit 1
      - name: Final validation
        if: success()
        working-directory: android
        run: timeout 600s ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease bundleRelease --stacktrace
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cardiag-apk-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Commit verified autonomous changes
        if: success()
        run: |
          set -euo pipefail
          git diff --check
          if [ -z "$(git status --porcelain)" ]; then echo 'No autonomous changes to commit'; exit 0; fi
          git add -A && git diff --cached --check
          git commit -m 'feat: advance autonomous CarDiag milestone'
          git push origin HEAD:main

name: CarDiag Autonomous Agent (Free AI Gateway)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cardiag-autonomous-agent
  cancel-in-progress: false

env:
  OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
  OPENROUTER_WIRE_API: responses
  AI_GATEWAY_MAX_OUTPUT_TOKENS: '8000'
  AI_GATEWAY_PROVIDER_ORDER: openrouter,groq,deepseek
  AI_AGENT_MAX_CYCLES: '12'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - name: Repair and normalize git state
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main && git reset --hard origin/main && git clean -fdx
      - name: Baseline
        env:
          OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = main
          test -f AGENTS.md && test -x android/gradlew && test -f android/app/build.gradle.kts
          test -f docs/agent-next-task.md && test -f agent-state.md
          test -x scripts/autonomous-agent.sh && test -f scripts/ai-gateway.py
          test -n "${OPEN_ROUTER_API_KEY}${GROQ_API_KEY}${DEEPSEEK_API_KEY}"
          test -z "$(git status --porcelain)"
          python3 -m py_compile scripts/ai-gateway.py
          bash -n scripts/autonomous-agent.sh
      - name: Java
        uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17', cache: gradle}
      - name: Android
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true
      - name: Node
        uses: actions/setup-node@v5
        with: {node-version: '22', package-manager-cache: false}
      - name: Install Codex CLI
        run: |
          set -euo pipefail
          npm install --global --no-audit --no-fund @openai/codex@0.151.0
          command -v codex
          codex --version
          codex --help >/dev/null
      - name: Run Codex through free-provider gateway
        env:
          OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          CARDIAG_GATEWAY_KEY: local-gateway-key
          CODEX_PROVIDER: cardiag_gateway
          CODEX_BASE_URL: http://127.0.0.1:8787/v1
          CODEX_ENV_KEY: CARDIAG_GATEWAY_KEY
          CODEX_WIRE_API: responses
        run: |
          set -euo pipefail
          export CODEX_HOME="$HOME/.codex-cardiag"
          mkdir -p "$CODEX_HOME"
          ./scripts/autonomous-agent.sh 2>&1 | tee /tmp/codex-agent.log
      - name: Final validation
        if: success()
        working-directory: android
        run: timeout 600s ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease bundleRelease --stacktrace
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cardiag-apk-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Commit verified autonomous changes
        if: success()
        run: |
          set -euo pipefail
          git diff --check
          if [ -z "$(git status --porcelain)" ]; then echo 'No autonomous changes to commit'; exit 32; fi
          git add -A && git diff --cached --check
          git commit -m 'feat: advance autonomous CarDiag milestone' && git push origin HEAD:main

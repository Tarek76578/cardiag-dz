name: CarDiag Autonomous Agent (Multi-Provider)

on:
  workflow_dispatch: {}
  push:
    branches:
      - feat/multi-provider-ai-gateway

permissions:
  contents: write

concurrency:
  group: cardiag-autonomous-agent
  cancel-in-progress: false

env:
  OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
  OPENROUTER_WIRE_API: responses
  OPENROUTER_MODEL: ${{ vars.AI_MODEL || 'openai/gpt-oss-120b:free' }}
  AI_MODEL: ${{ vars.AI_MODEL || 'openai/gpt-oss-120b:free' }}
  AI_GATEWAY_MAX_OUTPUT_TOKENS: '12000'
  AI_GATEWAY_PROVIDER_ORDER: openrouter,groq,nvidia,deepseek,gemini
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Baseline
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          test -f AGENTS.md && test -x android/gradlew && test -f android/app/build.gradle.kts
          test -f docs/agent-next-task.md && test -f agent-state.md
          test -x scripts/autonomous-agent.sh && test -f scripts/ai-gateway.py && test -f scripts/test_ai_gateway.py
          test -n "${{ secrets.OPEN_ROUTER_API_KEY }}${{ secrets.GROQ_API_KEY }}${{ secrets.NVIDIA_API_KEY }}${{ secrets.DEEPSEEK_API_KEY }}${{ secrets.GEMINI_API_KEY }}${{ secrets.GEMINI_KEY }}"
          python3 -m py_compile scripts/ai-gateway.py
          python3 scripts/test_ai_gateway.py
          bash -n scripts/autonomous-agent.sh

      - name: Java
        uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17', cache: gradle}

      - name: Android
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Node
        uses: actions/setup-node@v5
        with: {node-version: '22', package-manager-cache: false}

      - name: Install Codex CLI
        run: |
          set -euo pipefail
          npm install --global --no-audit --no-fund @openai/codex@0.151.0
          command -v codex && codex --version && codex --help >/dev/null

      - name: Start AI Gateway
        env:
          OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: |
          set -euo pipefail
          python3 scripts/ai-gateway.py >/tmp/cardiag-ai-gateway.log 2>&1 & echo $! >/tmp/gateway.pid
          for i in $(seq 1 30); do curl -fsS --max-time 1 http://127.0.0.1:8787/health >/tmp/gateway-health.json 2>/dev/null && break; sleep 1; done
          kill -0 "$(cat /tmp/gateway.pid)"
          python3 - <<'PY'
          import json, urllib.request
          health=json.load(urllib.request.urlopen('http://127.0.0.1:8787/health',timeout=5))
          assert health['status'] == 'ok'
          assert any(v['configured'] for v in health['providers'].values())
          print(json.dumps(health, indent=2))
          PY
          echo 'AI_GATEWAY_STARTED=1'

      - name: Run Codex with CarDiag gateway
        env:
          OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          CODEX_PROVIDER: cardiag_gateway
          AI_PROVIDER: openrouter
          AI_MODEL: ${{ vars.AI_MODEL || 'openai/gpt-oss-120b:free' }}
          OPENROUTER_MODEL: ${{ vars.AI_MODEL || 'openai/gpt-oss-120b:free' }}
          CODEX_BASE_URL: http://127.0.0.1:8787/v1
          CODEX_ENV_KEY: OPEN_ROUTER_API_KEY
          CODEX_WIRE_API: responses
          AI_GATEWAY_MAX_OUTPUT_TOKENS: '12000'
          AI_GATEWAY_PROVIDER_ORDER: openrouter,groq,nvidia,deepseek,gemini
        run: |
          set -euo pipefail
          export CODEX_HOME="$HOME/.codex-cardiag"
          mkdir -p "$CODEX_HOME"
          ./scripts/autonomous-agent.sh 2>&1 | tee /tmp/codex-agent.log

      - name: Final validation
        if: success()
        working-directory: android
        run: timeout 600s ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease bundleRelease --stacktrace

      - name: Commit verified autonomous changes
        if: success()
        run: |
          set -euo pipefail
          git diff --check
          if [ -z "$(git status --porcelain)" ]; then echo 'No autonomous changes to commit'; exit 32; fi
          git add -A && git diff --cached --check
          git commit -m 'feat: advance autonomous CarDiag milestone' && git push origin HEAD:main

name: CarDiag Autonomous Agent (OpenRouter)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cardiag-autonomous-agent
  cancel-in-progress: false

env:
  OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
  OPENROUTER_WIRE_API: responses
  OPENROUTER_RATE_LIMIT_RETRIES: '2'
  OPENROUTER_DEFAULT_RETRY_SECONDS: '45'
  OPENROUTER_PROXY_MAX_TOKENS: '12000'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - name: Repair and normalize git state
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main && git reset --hard origin/main && git clean -fdx
      - name: Baseline
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = main
          test -f AGENTS.md && test -x android/gradlew && test -f android/app/build.gradle.kts
          test -f docs/agent-next-task.md && test -f agent-state.md
          test -x scripts/autonomous-agent.sh && test -f scripts/openrouter-codex-proxy.py
          test -n "${{ secrets.OPEN_ROUTER_API_KEY }}" && test -z "$(git status --porcelain)"
      - name: Java
        uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17', cache: gradle}
      - name: Android
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true
      - name: Node
        uses: actions/setup-node@v5
        with: {node-version: '22', package-manager-cache: false}
      - name: Install Codex CLI
        run: |
          set -euo pipefail
          rm -rf /tmp/codex-cli
          npm install --prefix /tmp/codex-cli --no-save @openai/codex
          echo "/tmp/codex-cli/node_modules/.bin" >> "$GITHUB_PATH"
          /tmp/codex-cli/node_modules/.bin/codex --version
      - name: OpenRouter preflight
        id: provider
        env: {OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}}
        run: |
          set -euo pipefail
          curl -sS --max-time 20 -o /tmp/models.json -w '%{http_code}' -H "Authorization: Bearer $OPEN_ROUTER_API_KEY" "$OPENROUTER_BASE_URL/models" >/tmp/models.http
          test "$(cat /tmp/models.http)" = 200
          python3 - /tmp/models.json <<'PY' >/tmp/openrouter-candidates.txt
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8')); ms=d.get('data',[])
          def score(m):
            x=(m.get('id') or '').lower(); p=set(m.get('supported_parameters') or [])
            if 'tools' not in p and 'tool_choice' not in p: return -1
            if any(k in x for k in ('vision','audio','image','tts','whisper','embed','moderation')): return -1
            return (100000 if x.endswith(':free') else 0)+(5000 if 'code' in x or 'coder' in x else 0)+(4000 if 'gpt-oss' in x else 0)+min(int(m.get('context_length') or 0),128000)//1000
          for m in sorted(ms,key=score,reverse=True)[:12]:
            if score(m)>0: print(m['id'])
          PY
          selected=''
          while IFS= read -r model; do
            [ -n "$model" ] || continue
            payload="$(MODEL="$model" python3 -c 'import json,os; print(json.dumps({"model":os.environ["MODEL"],"input":"Reply with exactly OK","max_output_tokens":16}))')"
            code="$(curl -sS --max-time 30 -o /tmp/probe.json -w '%{http_code}' -H "Authorization: Bearer $OPEN_ROUTER_API_KEY" -H 'Content-Type: application/json' -d "$payload" "$OPENROUTER_BASE_URL/responses")" || true
            echo "OPENROUTER_RESPONSES_PROBE_HTTP=$code MODEL=$model"
            if [ "$code" = 200 ]; then selected="$model"; break; fi
            [ "$code" = 429 ] && sleep "$OPENROUTER_DEFAULT_RETRY_SECONDS"
          done </tmp/openrouter-candidates.txt
          test -n "$selected" && echo "model=$selected" >> "$GITHUB_OUTPUT"
      - name: Start token interceptor
        env: {OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}}
        run: |
          set -euo pipefail
          python3 scripts/openrouter-codex-proxy.py >/tmp/openrouter-proxy.log 2>&1 & echo $! >/tmp/proxy.pid
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/v1/models >/dev/null 2>&1 && break; sleep 1; done
          kill -0 "$(cat /tmp/proxy.pid)"
          python3 - <<'PY'
          import json,urllib.request
          req=urllib.request.Request('http://127.0.0.1:8787/v1/responses',data=json.dumps({'model':'interceptor-test','input':'x','max_output_tokens':65536}).encode(),headers={'Content-Type':'application/json'},method='POST')
          try: urllib.request.urlopen(req,timeout=3)
          except Exception: pass
          PY
          grep -q 'TOKEN_CLAMP.*original=65536.*effective=12000' /tmp/openrouter-proxy.log
          echo 'TOKEN_INTERCEPTOR_TEST=PASS'
      - name: Run Codex with OpenRouter
        env:
          OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
          CODEX_PROVIDER: openrouter
          AI_PROVIDER: openrouter
          AI_MODEL: ${{ steps.provider.outputs.model }}
          CODEX_BASE_URL: http://127.0.0.1:8787/v1
          CODEX_ENV_KEY: OPEN_ROUTER_API_KEY
          CODEX_WIRE_API: responses
          OPENROUTER_PROXY_MAX_TOKENS: '12000'
        run: |
          set -euo pipefail
          export CODEX_HOME="$HOME/.codex-cardiag"
          mkdir -p "$CODEX_HOME"
          ./scripts/autonomous-agent.sh 2>&1 | tee /tmp/codex-agent.log
      - name: Final validation
        if: success()
        working-directory: android
        run: timeout 600s ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease bundleRelease --stacktrace
      - name: Commit verified autonomous changes
        if: success()
        run: |
          set -euo pipefail
          git diff --check
          if [ -z "$(git status --porcelain)" ]; then echo 'No autonomous changes to commit'; exit 32; fi
          git add -A && git diff --cached --check
          git commit -m 'feat: advance autonomous CarDiag milestone' && git push origin HEAD:main

name: CarDiag OpenRouter Autonomous Agent

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cardiag-openrouter-agent
  cancel-in-progress: false

env:
  OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
  OPENROUTER_MODEL: openrouter/free

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Repair and normalize git state
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if git ls-files --stage -- .codex/.tmp/plugins | grep -q '^160000 '; then
            git rm --cached --force --ignore-unmatch .codex/.tmp/plugins
            rm -rf .codex/.tmp/plugins
            git commit -m 'chore: remove invalid codex plugins gitlink'
            git push origin HEAD:main
          fi
          git fetch origin main
          git reset --hard origin/main
          git clean -fdx

      - name: Baseline
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = main
          test -f AGENTS.md
          test -f android/gradlew
          test -f android/app/build.gradle.kts
          test -f docs/agent-next-task.md
          test -f scripts/autonomous-agent.sh
          test -n "${{ secrets.OPENROUTER_API_KEY }}"
          test -z "$(git status --porcelain)"

      - name: Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Android
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Codex CLI
        run: |
          set -euo pipefail
          rm -rf /tmp/codex-cli
          npm install --prefix /tmp/codex-cli --no-save @openai/codex
          echo "/tmp/codex-cli/node_modules/.bin" >> "$GITHUB_PATH"
          /tmp/codex-cli/node_modules/.bin/codex --version

      - name: OpenRouter quota preflight
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$OPENROUTER_API_KEY"
          python3 - <<'PY'
          import json, os, sys, urllib.request, urllib.error
          base = os.environ['OPENROUTER_BASE_URL'].rstrip('/')
          key = os.environ['OPENROUTER_API_KEY']
          req = urllib.request.Request(base + '/key', headers={'Authorization': 'Bearer ' + key})
          try:
              with urllib.request.urlopen(req, timeout=20) as r:
                  data = json.load(r)
          except urllib.error.HTTPError as e:
              detail = e.read().decode('utf-8', 'replace')[:500]
              print(f'OPENROUTER_KEY_CHECK_FAILED status={e.code} detail={detail}', file=sys.stderr)
              raise SystemExit(2)
          info = data.get('data') or data
          print('OPENROUTER_KEY_VALID=1')
          print('OPENROUTER_KEY_LIMIT=', info.get('limit'))
          print('OPENROUTER_KEY_USAGE=', info.get('usage'))
          print('OPENROUTER_FREE_QUOTA_NOTE=free-model daily quota is enforced by the model endpoint and is not exposed as a remaining counter by /key')
          PY

          curl -fsS --connect-timeout 10 --max-time 20 \
            -H "Authorization: Bearer $OPENROUTER_API_KEY" \
            "$OPENROUTER_BASE_URL/models" > /tmp/openrouter-models.json

      - name: Select one agent model without quota-burning probes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          data = json.load(open('/tmp/openrouter-models.json'))
          ids = {str(m.get('id')) for m in data.get('data', []) if m.get('id')}
          preferred = [
              'openrouter/free',
              'cohere/north-mini-code:free',
              'poolside/laguna-s-2.1:free',
              'nvidia/nemotron-3-ultra-550b-a55b:free',
              'minimax/minimax-m3:free',
          ]
          candidates = [m for m in preferred if m in ids]
          if not candidates:
              raise SystemExit('No known free agent model is currently listed by OpenRouter')
          # Exactly one model per autonomous run. A second free-model attempt can
          # consume another request after a provider-side failure and is unsafe on
          # the 50-request daily free quota.
          open('/tmp/openrouter-model', 'w').write(candidates[0] + '\n')
          print('OPENROUTER_AGENT_MODEL=', candidates[0])
          PY

      - name: Autonomous Codex agent
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          chmod +x scripts/autonomous-agent.sh
          export OPENROUTER_API_KEY
          export CODEX_HOME="$HOME/.codex-cardiag"
          mkdir -p "$CODEX_HOME"
          model="$(cat /tmp/openrouter-model)"
          echo "=== TRYING OPENROUTER AGENT MODEL: $model ==="
          set +e
          OPENROUTER_MODEL="$model" ./scripts/autonomous-agent.sh 2>&1 | tee /tmp/codex-agent.log
          agent_status=${PIPESTATUS[0]}
          set -e
          if grep -qE '429 Too Many Requests|free-models-per-day|Rate limit exceeded' /tmp/codex-agent.log; then
            echo 'OPENROUTER_QUOTA_EXHAUSTED=1'
            echo 'No fallback model will be attempted; doing so would spend additional free requests.'
            exit 75
          fi
          if [ "$agent_status" -ne 0 ]; then
            echo "OPENROUTER_MODEL_FAILED=$model stage=codex status=$agent_status"
            exit "$agent_status"
          fi
          echo "OPENROUTER_CODEX_SUCCESS=$model"

      - name: Final validation
        working-directory: android
        run: timeout 240s ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease bundleRelease --stacktrace

      - name: Commit verified autonomous changes
        run: |
          set -euo pipefail
          git diff --check
          if [ -z "$(git status --porcelain)" ]; then
            echo "No autonomous changes to commit"
            exit 32
          fi
          git status --short
          git add -A
          git diff --cached --check
          git diff --cached --name-status
          git commit -m "feat: advance autonomous CarDiag milestone"
          git push origin HEAD:main

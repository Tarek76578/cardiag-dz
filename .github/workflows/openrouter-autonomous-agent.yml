name: CarDiag Autonomous Agent

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cardiag-autonomous-agent
  cancel-in-progress: false

env:
  OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
  OPENROUTER_MODEL: qwen/qwen3-coder:free
  GROQ_BASE_URL: https://api.groq.com/openai/v1
  GROQ_MODEL: qwen/qwen3-32b
  GROQ_WIRE_API: responses

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Repair and normalize git state
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if git ls-files --stage -- .codex/.tmp/plugins | grep -q '^160000 '; then
            git rm --cached --force --ignore-unmatch .codex/.tmp/plugins
            rm -rf .codex/.tmp/plugins
            git commit -m 'chore: remove invalid codex plugins gitlink'
            git push origin HEAD:main
          fi
          git fetch origin main
          git reset --hard origin/main
          git clean -fdx

      - name: Baseline
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = main
          test -f AGENTS.md
          test -f android/gradlew
          test -f android/app/build.gradle.kts
          test -f docs/agent-next-task.md
          test -f scripts/autonomous-agent.sh
          test -f scripts/groq-codex-proxy.py
          test -n "${{ secrets.GROQ_API_KEY }}" || test -n "${{ secrets.OPENROUTER_API_KEY }}"
          test -z "$(git status --porcelain)"

      - name: Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Android
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Codex CLI
        run: |
          set -euo pipefail
          rm -rf /tmp/codex-cli
          npm install --prefix /tmp/codex-cli --no-save @openai/codex
          echo "/tmp/codex-cli/node_modules/.bin" >> "$GITHUB_PATH"
          /tmp/codex-cli/node_modules/.bin/codex --version

      - name: Select independent provider
        id: provider
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          if [ -n "$GROQ_API_KEY" ]; then
            echo "provider=groq" >> "$GITHUB_OUTPUT"
            echo "model=$GROQ_MODEL" >> "$GITHUB_OUTPUT"
            echo "base_url=$GROQ_BASE_URL" >> "$GITHUB_OUTPUT"
            echo "env_key=GROQ_API_KEY" >> "$GITHUB_OUTPUT"
            echo "wire_api=responses" >> "$GITHUB_OUTPUT"
            echo "AI_PROVIDER_SELECTED=groq"
            echo "AI_MODEL_SELECTED=$GROQ_MODEL"
            echo "AI_WIRE_API_SELECTED=responses"
            exit 0
          fi
          if [ -n "$OPENROUTER_API_KEY" ]; then
            echo "provider=openrouter" >> "$GITHUB_OUTPUT"
            echo "model=$OPENROUTER_MODEL" >> "$GITHUB_OUTPUT"
            echo "base_url=$OPENROUTER_BASE_URL" >> "$GITHUB_OUTPUT"
            echo "env_key=OPENROUTER_API_KEY" >> "$GITHUB_OUTPUT"
            echo "wire_api=responses" >> "$GITHUB_OUTPUT"
            echo "AI_PROVIDER_SELECTED=openrouter"
            echo "AI_WIRE_API_SELECTED=responses"
            echo "AI_PROVIDER_WARNING=GROQ_API_KEY is not configured; OpenRouter remains the last-resort provider"
            exit 0
          fi
          echo 'No independent AI provider key is configured.' >&2
          exit 13

      - name: OpenRouter key preflight
        if: steps.provider.outputs.provider == 'openrouter'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys, urllib.request, urllib.error
          base = os.environ['OPENROUTER_BASE_URL'].rstrip('/')
          key = os.environ['OPENROUTER_API_KEY']
          req = urllib.request.Request(base + '/key', headers={'Authorization': 'Bearer ' + key})
          try:
              with urllib.request.urlopen(req, timeout=20) as r:
                  data = json.load(r)
          except urllib.error.HTTPError as e:
              detail = e.read().decode('utf-8', 'replace')[:500]
              print(f'OPENROUTER_KEY_CHECK_FAILED status={e.code} detail={detail}', file=sys.stderr)
              raise SystemExit(2)
          info = data.get('data') or data
          print('OPENROUTER_KEY_VALID=1')
          print('OPENROUTER_KEY_LIMIT=', info.get('limit'))
          print('OPENROUTER_KEY_USAGE=', info.get('usage'))
          print('OPENROUTER_NO_INFERENCE_PROBE=1')
          PY

      - name: Autonomous Codex agent
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CODEX_PROVIDER: ${{ steps.provider.outputs.provider }}
          AI_PROVIDER: ${{ steps.provider.outputs.provider }}
          AI_MODEL: ${{ steps.provider.outputs.model }}
          CODEX_BASE_URL: ${{ steps.provider.outputs.base_url }}
          CODEX_ENV_KEY: ${{ steps.provider.outputs.env_key }}
          CODEX_WIRE_API: responses
        run: |
          set -euo pipefail
          chmod +x scripts/autonomous-agent.sh
          export CODEX_HOME="$HOME/.codex-cardiag"
          mkdir -p "$CODEX_HOME"
          echo "=== RUNNING CODEX PROVIDER: $CODEX_PROVIDER MODEL: $AI_MODEL WIRE_API: responses ==="
          set +e
          ./scripts/autonomous-agent.sh 2>&1 | tee /tmp/codex-agent.log
          agent_status=${PIPESTATUS[0]}
          set -e
          if grep -qE '429 Too Many Requests|free-models-per-day|Rate limit exceeded' /tmp/codex-agent.log; then
            echo "AI_PROVIDER_RATE_LIMITED=$CODEX_PROVIDER"
            echo 'Provider was rate-limited; no second provider is attempted inside the same run.'
            exit 75
          fi
          if [ "$agent_status" -ne 0 ]; then
            echo "AI_PROVIDER_FAILED=$CODEX_PROVIDER status=$agent_status"
            exit "$agent_status"
          fi
          echo "AI_PROVIDER_SUCCESS=$CODEX_PROVIDER/$AI_MODEL"

      - name: Final validation
        working-directory: android
        run: timeout 240s ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease bundleRelease --stacktrace

      - name: Commit verified autonomous changes
        run: |
          set -euo pipefail
          git diff --check
          if [ -z "$(git status --porcelain)" ]; then
            echo "No autonomous changes to commit"
            exit 32
          fi
          git status --short
          git add -A
          git diff --cached --check
          git diff --cached --name-status
          git commit -m "feat: advance autonomous CarDiag milestone"
          git push origin HEAD:main

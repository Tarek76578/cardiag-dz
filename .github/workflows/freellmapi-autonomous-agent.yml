name: CarDiag FreeLLMAPI Agent

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cardiag-freellmapi-agent
  cancel-in-progress: false

env:
  FREELLMAPI_PORT: 3001
  CODEX_SHIM_PORT: 8787
  CODEX_SHIM_VERSION: v0.6.6

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}

      - name: Repair and normalize git state
        run: |
          set -euo pipefail
          if git ls-files --stage -- .codex/.tmp/plugins | grep -q '^160000 '; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git rm --cached --force --ignore-unmatch .codex/.tmp/plugins
            rm -rf .codex/.tmp/plugins
            git commit -m 'chore: remove invalid codex plugins gitlink'
            git push origin HEAD:main
          fi
          git fetch origin main
          git reset --hard origin/main
          git clean -fdx

      - name: Baseline
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = main
          test -f AGENTS.md && test -f android/gradlew && test -f android/app/build.gradle.kts && test -f docs/agent-next-task.md
          test -z "$(git status --porcelain)"

      - name: Java
        uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17', cache: gradle}

      - name: Android
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Node
        uses: actions/setup-node@v5
        with: {node-version: '22'}

      - name: Start FreeLLMAPI
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/SeyhmusKaya/freellmapi-extended.git /tmp/freellmapi
          cd /tmp/freellmapi
          npm ci
          export ENCRYPTION_KEY="$(node -e "console.log(require('crypto').randomBytes(32).toString('hex'))")" PORT="$FREELLMAPI_PORT"
          npm run dev >/tmp/freellmapi.log 2>&1 & echo $! >/tmp/freellmapi.pid
          rm -f /tmp/models.json
          for i in $(seq 1 45); do
            if curl -fsS "http://127.0.0.1:$FREELLMAPI_PORT/v1/models" >/tmp/models.json; then break; fi
            sleep 2
          done
          test -s /tmp/models.json || { tail -n 100 /tmp/freellmapi.log; exit 20; }
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/models.json'))
          ids=[m.get('id') for m in d.get('data',[]) if m.get('id')]
          print('FREELLMAPI_MODELS=',len(ids))
          assert ids
          PY
          DB_PATH="$(find /tmp/freellmapi -name freeapi.db -type f -print -quit)"
          test -n "$DB_PATH"
          GATEWAY_KEY="$(DB_PATH="$DB_PATH" node - <<'NODE'
          const Database=require('/tmp/freellmapi/node_modules/better-sqlite3');
          const db=new Database(process.env.DB_PATH,{readonly:true});
          const rows=db.prepare("SELECT key,value FROM settings WHERE key LIKE '%unified%' OR key LIKE '%api%key%'").all();
          const c=rows.map(r=>String(r.value||'').trim()).filter(v=>v.length>=20&&!/^your-/i.test(v));
          if(!c.length)process.exit(2);
          process.stdout.write(c.sort((a,b)=>b.length-a.length)[0]);
          NODE
          )"
          test "${#GATEWAY_KEY}" -ge 20
          echo "::add-mask::$GATEWAY_KEY"
          echo "GATEWAY_KEY=$GATEWAY_KEY" >> "$GITHUB_ENV"

      - name: Build free-model list
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          ids=[m['id'] for m in json.load(open('/tmp/models.json')).get('data',[]) if m.get('id')]
          priority=('coder','coding','devstral','codestral','qwen','deepseek','kimi','gemma','llama')
          out=[]
          for key in priority:
              out += [x for x in ids if key in x.lower() and x not in out]
          open('/tmp/model-candidates','w').write('\n'.join(out[:8]))
          print('FREE_MODEL_CANDIDATES=',len(out[:8]))
          print('\n'.join(out[:8]))
          PY

      - name: Install Codex CLI and Responses shim
        run: |
          set -euo pipefail
          rm -rf /tmp/codex-cli
          npm install --prefix /tmp/codex-cli --no-save @openai/codex
          echo "/tmp/codex-cli/node_modules/.bin" >> "$GITHUB_PATH"
          /tmp/codex-cli/node_modules/.bin/codex --version
          curl -fsSL "https://github.com/pige0n-ai/codex-shim/releases/download/${CODEX_SHIM_VERSION}/codex-shim-${CODEX_SHIM_VERSION}-x86_64-unknown-linux-musl" -o /tmp/codex-shim
          chmod +x /tmp/codex-shim
          /tmp/codex-shim --version

      - name: Codex Agent with build-gated fallback
        run: |
          set -euo pipefail
          chmod +x scripts/autonomous-agent.sh
          export GATEWAY_KEY="$GATEWAY_KEY"
          export CODEX_HOME="$HOME/.codex-cardiag"
          export CODEX_BASE_URL="http://127.0.0.1:${CODEX_SHIM_PORT}/v1"
          rm -rf "$CODEX_HOME"
          mkdir -p "$CODEX_HOME"
          success=0
          while IFS= read -r model; do
            [ -n "$model" ] || continue
            echo "=== TRYING FREE MODEL: $model ==="
            export FREELLMAPI_MODEL="$model"
            rm -rf /tmp/cardiag-shim
            mkdir -p /tmp/cardiag-shim
            cat >/tmp/cardiag-shim/config.yaml <<YAML
          server:
            listen: 127.0.0.1:${CODEX_SHIM_PORT}
            base_path: /v1
            auth:
              mode: optional-bearer
              accepted_bearer_tokens: []
          upstream:
            base_url: http://127.0.0.1:${FREELLMAPI_PORT}/v1
            chat_path: /chat/completions
            responses_path: /responses
            models_path: /models
            api_key_env: GATEWAY_KEY
            timeout_seconds: 90
            connect_timeout_seconds: 5
            max_retries: 0
            stream_max_retries: 0
            downstream_heartbeat_seconds: 15
          provider:
            kind: deepseek-chat
            profile_config:
              profile: deepseek-chat
              capabilities:
                endpoint_mode: null
                tool_policy: function_tools_only
                state_policy: adapter_stateful
          models:
            default: ${model}
            catalog:
              - slug: ${model}
                display_name: ${model}
                context_window: 131072
                tool_calling: true
                vision: false
                reasoning_levels: []
                priority: 10
                supports_search_tool: false
                apply_patch_tool_type: freeform
                apply_patch_upstream_tool_type: structured
                apply_patch_upstream_strict: false
          reasoning:
            enabled: false
            effort: high
            expose_reasoning_to_client: false
            persist_reasoning_for_tool_calls: true
          state:
            backend: memory
            ttl_seconds: 3600
            debug_artifact_ttl_seconds: 300
            failed_debug_artifact_ttl_seconds: 300
            cleanup_interval_seconds: 600
          logging:
            level: warn
            redact_api_keys: true
            redact_message_content: true
            log_sse_events: false
          YAML
            rm -f /tmp/codex-shim.pid /tmp/cardiag-shim.log
            GATEWAY_KEY="$GATEWAY_KEY" /tmp/codex-shim --config /tmp/cardiag-shim/config.yaml >/tmp/cardiag-shim.log 2>&1 & echo $! >/tmp/codex-shim.pid
            shim_ready=0
            for i in $(seq 1 30); do
              if curl -fsS "http://127.0.0.1:${CODEX_SHIM_PORT}/v1/models" >/tmp/shim-models.json 2>/dev/null; then shim_ready=1; break; fi
              sleep 1
            done
            if [ "$shim_ready" -ne 1 ]; then
              echo "CODEX_SHIM_START_FAILED=$model"
              tail -n 80 /tmp/cardiag-shim.log || true
              kill "$(cat /tmp/codex-shim.pid)" 2>/dev/null || true
              continue
            fi
            git restore -- android/app/src/main/java/dz/cardiag/app/core/road/RoadAssistantService.kt android/app/src/main/java/dz/cardiag/app/core/road/RoadAssistantProviders.kt 2>/dev/null || true
            set +e
            timeout 120s ./scripts/autonomous-agent.sh
            agent_status=$?
            set -e
            kill "$(cat /tmp/codex-shim.pid)" 2>/dev/null || true
            if [ "$agent_status" -ne 0 ]; then
              echo "FREE_MODEL_FAILED=$model stage=codex status=$agent_status"
              git restore -- android/app/src/main/java/dz/cardiag/app/core/road/RoadAssistantService.kt android/app/src/main/java/dz/cardiag/app/core/road/RoadAssistantProviders.kt 2>/dev/null || true
              find android/app/src/main/java/dz/cardiag/app/core/road -maxdepth 1 -type f -name "*.bak" -delete 2>/dev/null || true
              continue
            fi
            echo "FREE_MODEL_CODEX_SUCCESS=$model"
            set +e
            timeout 180s bash -lc 'cd android && ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug --stacktrace'
            build_status=$?
            set -e
            if [ "$build_status" -eq 0 ]; then
              echo "FREE_MODEL_BUILD_SUCCESS=$model"
              success=1
              break
            fi
            echo "FREE_MODEL_FAILED=$model stage=android-build status=$build_status"
            git restore -- android/app/src/main/java/dz/cardiag/app/core/road/RoadAssistantService.kt android/app/src/main/java/dz/cardiag/app/core/road/RoadAssistantProviders.kt 2>/dev/null || true
            find android/app/src/main/java/dz/cardiag/app/core/road -maxdepth 1 -type f -name "*.bak" -delete 2>/dev/null || true
          done < /tmp/model-candidates
          [ "$success" -eq 1 ] || { echo 'All free models failed'; exit 1; }

      - name: Final validation
        working-directory: android
        run: timeout 240s ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease bundleRelease --stacktrace

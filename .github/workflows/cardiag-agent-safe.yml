name: CarDiag Autonomous Engineer (safe)

on:
  workflow_dispatch:
  repository_dispatch:
    types: [agent-bootstrap, android-build-success]

permissions:
  contents: write
  actions: write
  pull-requests: write
  issues: write

concurrency:
  group: cardiag-agent-main
  cancel-in-progress: false

env:
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  OPENROUTER_MODEL: openrouter/free
  GH_TOKEN: ${{ secrets.CARDIAG_WORKFLOW_TOKEN }}

jobs:
  agent:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.CARDIAG_WORKFLOW_TOKEN }}

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 platforms;android-36 build-tools;35.0.0'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Baseline validation
        working-directory: android
        continue-on-error: true
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug --stacktrace

      - name: Verify OpenRouter key
        run: test -n "$OPENROUTER_API_KEY"

      - name: Verify workflow token
        run: test -n "$GH_TOKEN"

      - name: Install Codex CLI
        run: npm install -g @openai/codex

      - name: Run autonomous principal engineer
        env:
          CODEX_HOME: ${{ github.workspace }}/.codex
        run: |
          set -euo pipefail
          mkdir -p "$CODEX_HOME"
          cat > "$CODEX_HOME/config.toml" <<'EOF'
model = "openrouter/free"
model_provider = "openrouter"
model_reasoning_effort = "high"
approval_policy = "never"
sandbox_mode = "danger-full-access"

[model_providers.openrouter]
name = "OpenRouter"
base_url = "https://openrouter.ai/api/v1"
env_key = "OPENROUTER_API_KEY"
EOF
          codex exec --full-auto --skip-git-repo-check "You are the autonomous principal engineer, product engineer, QA engineer, and release engineer for CarDiag DZ. Turn the current repository into a polished production-quality commercial Android product for the Algerian automotive market with minimal human intervention. Read AGENTS.md and agent-state.md first. Inspect the repository and latest CI state. Build an evidence-based backlog and work through the highest-impact incomplete items. Modify code, tests, resources, Gradle, data, docs and CI/CD as needed. Preserve Arabic RTL and French localization. Never weaken tests, disable security, suppress defects, or fabricate automotive/pricing/service data. Validate with integrity/secret scan, compilation, unit tests, lint, debug APK, runtime tests when infrastructure exists, and release APK/AAB when appropriate. When CI fails, inspect actual logs and fix root causes. Update agent-state.md with evidence, blockers, and next priorities. Commit and push coherent production-quality changes to main. Do not declare completion merely because a build is green."

      - name: Verify coherent state
        run: |
          set -euo pipefail
          test -f AGENTS.md
          test -f agent-state.md
          git diff --check

      - name: Commit and push agent changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No changes produced by agent.'
            exit 0
          fi
          git add -A
          git commit -m 'chore(agent): autonomous engineering cycle'
          git fetch origin main
          git rebase origin/main
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git push origin HEAD:main

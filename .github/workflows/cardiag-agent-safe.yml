name: CarDiag Autonomous Engineer (safe)

on:
  workflow_dispatch:
  repository_dispatch:
    types: [android-build-success, agent-bootstrap]

permissions:
  contents: write
  actions: write
  pull-requests: write
  issues: write

concurrency:
  group: cardiag-agent-main
  cancel-in-progress: false

env:
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  OPENROUTER_MODEL: openrouter/free
  GH_TOKEN: ${{ secrets.CARDIAG_WORKFLOW_TOKEN }}

jobs:
  agent:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.CARDIAG_WORKFLOW_TOKEN }}

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 platforms;android-36 build-tools;35.0.0"
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Baseline validation
        working-directory: android
        continue-on-error: true
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug --stacktrace

      - name: Verify OpenRouter key
        run: test -n "$OPENROUTER_API_KEY"

      - name: Verify workflow token
        run: test -n "$GH_TOKEN"

      - name: Install Codex CLI
        run: npm install -g @openai/codex

      - name: Run autonomous principal engineer
        env:
          CODEX_HOME: ${{ github.workspace }}/.codex
        run: |
          set -euo pipefail
          mkdir -p "$CODEX_HOME"
          cat > "$CODEX_HOME/config.toml" <<'EOF'
model = "openrouter/free"
model_provider = "openrouter"
model_reasoning_effort = "high"
approval_policy = "never"
sandbox_mode = "danger-full-access"

[model_providers.openrouter]
name = "OpenRouter"
base_url = "https://openrouter.ai/api/v1"
env_key = "OPENROUTER_API_KEY"
EOF
          codex exec --full-auto --skip-git-repo-check "You are the autonomous principal engineer, product engineer, QA engineer, and release engineer for CarDiag DZ. Your mission is to turn the current repository into a polished, production-quality commercial Android product for the Algerian automotive market with minimal human intervention. Read AGENTS.md and agent-state.md first. Then inspect the entire repository, Android implementation, tests, data/backend/migrations, CI/CD workflows, and the latest relevant GitHub Actions state. Build an evidence-based prioritized backlog. Work on the single highest-impact incomplete item, but continue through additional items when time and validation capacity allow. You have authority to modify the full repository, tests, resources, Gradle configuration, database/migrations, documentation, and CI/CD workflows when necessary. You may use the configured GitHub workflow token to inspect or dispatch repository automation and to push coherent changes. Do not expose or print token/API-key values. Never weaken tests, disable security, suppress real defects, fabricate automotive/pricing/service data, or make cosmetic changes while a correctness/security/build blocker exists. Preserve Arabic RTL and French localization. Validate every change with the strongest available checks: integrity/secret scan, compilation, unit tests, lint, debug APK, emulator/runtime tests if infrastructure exists, and release APK/AAB when appropriate. When CI fails, read the actual logs and fix the root cause; never guess. Inspect the resulting diff for regressions and secrets. Update agent-state.md with exactly what changed, validation evidence, remaining blockers, and next priorities. Commit and push production-quality changes to main. After pushing, inspect the resulting CI state when possible and continue from the next highest-priority blocker on the next autonomous cycle. Do not declare the product complete merely because a build is green. The final gate requires critical functionality, UX, RTL/localization, security, data integrity, tests, runtime validation where available, and release packaging to be genuinely complete."

      - name: Verify agent produced a coherent state
        run: |
          set -euo pipefail
          test -f AGENTS.md
          test -f agent-state.md
          git diff --check

      - name: Commit and push agent changes with PAT
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes produced by agent."
            exit 0
          fi
          git add -A
          git commit -m "chore(agent): autonomous engineering cycle"
          git fetch origin main
          git rebase origin/main
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git push origin HEAD:main

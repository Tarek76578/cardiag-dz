name: CarDiag Autonomous Engineer (safe)

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

concurrency:
  group: cardiag-autonomous-engineer
  cancel-in-progress: true

permissions:
  contents: write
  actions: read
  pull-requests: write
  issues: write

jobs:
  agent:
    name: Autonomous engineering cycle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: android/**/*.gradle*

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Preflight Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew --version

      - name: Baseline validation
        continue-on-error: true
        run: ./gradlew test lint assembleDebug --stacktrace

      - name: Run Codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          sandbox: workspace-write
          model: gpt-5.6
          effort: high
          prompt: |
            You are the autonomous principal engineer for ${{ github.repository }}.
            The Android project is under android/. Read AGENTS.md and agent-state.md first.
            Inspect the repository, latest GitHub Actions runs and failures, then work through the project Definition of Done continuously across scheduled cycles.
            Select the highest-impact production blocker or one coherent milestone for this cycle. Inspect callers/models/tests before edits.
            Make the smallest correct production change and run relevant validation from android/.
            Never disable, weaken, skip, delete, or rewrite tests merely to obtain green CI. Never commit secrets.
            Do not make speculative broad rewrites.
            Do not commit or push from inside Codex. The workflow commits validated workspace changes after this step.
            If blocked by an external dependency, record the exact blocker in agent-state.md and continue with independent work.
            Priorities: correctness/crash prevention > CI/build > security > data integrity > tests > architecture > UX/UI > optimization > new features.
            Product goal: a professional production Android automotive diagnostics product for Algeria, with Arabic RTL and French, robust vehicle/diagnostic knowledge, secure Supabase integration, OBD-ready architecture, polished Compose UI/UX, runtime validation, and release APK/AAB buildability.
            Do not declare the project finished merely because compilation succeeds. Continue until the Definition of Done in AGENTS.md is satisfied; leave an accurate checkpoint in agent-state.md.

      - name: Commit validated agent changes
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "CarDiag Autonomous Engineer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git diff --cached --check
            git commit -m "chore(agent): autonomous engineering cycle"
            git push origin HEAD:main
          else
            echo "No changes produced by agent."
          fi

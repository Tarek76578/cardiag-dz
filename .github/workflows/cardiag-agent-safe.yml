name: CarDiag Autonomous Engineer (safe)

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

concurrency:
  group: cardiag-autonomous-engineer
  cancel-in-progress: false

permissions:
  contents: write
  actions: read
  pull-requests: write
  issues: write

jobs:
  agent:
    name: Autonomous engineering cycle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: android/**/*.gradle*

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Verify Android project
        working-directory: android
        run: |
          test -f ./gradlew
          chmod +x ./gradlew
          ./gradlew --version

      - name: Baseline validation
        continue-on-error: true
        working-directory: android
        run: ./gradlew test lint assembleDebug --stacktrace

      - name: Verify Codex secret is present
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY GitHub Actions secret is missing or empty."
            exit 1
          fi
          echo "OPENAI_API_KEY secret is present."

      - name: Run Codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          model: gpt-5.6
          effort: high
          prompt: |
            You are the autonomous principal engineer for ${{ github.repository }}.
            The Android project is under android/. Read AGENTS.md and agent-state.md first.
            Your mission is to continue the CarDiag project toward the complete professional-product Definition of Done, not merely repair CI.
            Inspect the repository and recent GitHub Actions failures. Choose the highest-impact unfinished milestone or production blocker for this cycle.
            Before editing, inspect relevant callers, models, tests, resources, and existing architecture. Make production-correct changes and add/regress tests where appropriate.
            Validate from android/ after changes. Never disable, weaken, skip, delete, or rewrite tests merely to obtain green CI. Never commit secrets. Never make speculative broad rewrites.
            Do not commit or push from inside Codex; the workflow handles the commit after the agent exits.
            If an external dependency prevents completion, record the exact blocker in agent-state.md and continue with independent work.
            Priorities: correctness/crash prevention > CI/build > security > data integrity > tests > architecture > UX/UI > optimization > new features.
            Product requirements include: professional Kotlin/Compose/Material 3 architecture and UI; Arabic RTL and French; first-run language selection and settings language switching; Algerian vehicle catalog; diagnostic codes with symptoms/causes/tests/repair guidance; guided diagnosis; OBD-ready abstraction and robust scanner/PID handling; history/reports where supported; offline/local knowledge; secure Supabase integration and RLS where used; accessibility; performance; unit/UI/runtime tests; emulator smoke testing when infrastructure supports it; release APK/AAB and release hardening.
            Do not invent automotive facts, diagnostic results, prices, or hardware validation. Clearly mark unavailable/uncertain data.
            Do not declare the project finished merely because compilation succeeds. Continue across future scheduled cycles until AGENTS.md Definition of Done is satisfied. At the end, update agent-state.md with completed work, verification, blockers, and the next highest-priority milestone.

      - name: Commit validated agent changes
        working-directory: .
        run: |
          git config user.name "CarDiag Autonomous Engineer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git diff --cached --check
            git commit -m "chore(agent): autonomous engineering cycle"
            git push origin HEAD:main
          else
            echo "No changes produced by agent."
          fi

name: CarDiag Autonomous Engineer (safe)

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CarDiag DZ Android"]
    types: [completed]

concurrency:
  group: cardiag-autonomous-engineer
  cancel-in-progress: false

permissions:
  contents: write
  actions: read
  pull-requests: write
  issues: write

jobs:
  agent:
    name: Autonomous engineering cycle
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: android/**/*.gradle*

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Verify Android project
        working-directory: android
        run: |
          test -f ./gradlew
          chmod +x ./gradlew
          ./gradlew --version

      - name: Baseline validation
        continue-on-error: true
        working-directory: android
        run: ./gradlew test lint assembleDebug --stacktrace

      - name: Verify OpenRouter secret is present
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "OPENROUTER_API_KEY GitHub Actions secret is missing or empty."
            exit 1
          fi
          echo "OPENROUTER_API_KEY secret is present."

      - name: Run coding agent through OpenRouter
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          npm install -g @openai/codex
          codex --version
          mkdir -p "$HOME/.codex"
          cat > "$HOME/.codex/config.toml" <<'EOF'
          model_provider = "openrouter"
          model = "openrouter/free"
          model_reasoning_effort = "high"
          approval_policy = "never"
          sandbox_mode = "danger-full-access"

          [model_providers.openrouter]
          name = "OpenRouter"
          base_url = "https://openrouter.ai/api/v1"
          env_key = "OPENROUTER_API_KEY"
          wire_api = "responses"
          EOF
          codex exec --sandbox danger-full-access --skip-git-repo-check --model openrouter/free "You are the autonomous principal engineer for ${{ github.repository }}. The Android project is under android/. Read AGENTS.md and agent-state.md first. Continue the CarDiag project toward the complete professional-product Definition of Done. Inspect the repository and the latest CI result, identify the highest-impact unfinished blocker, inspect relevant code/tests before editing, make production-correct changes, add regression tests where appropriate, validate from android/, never weaken tests/checks, never commit secrets, and avoid speculative broad rewrites. Priorities: correctness/crash prevention > build stability > security > data integrity > tests > architecture > UX/UI > optimization > new features. Requirements include professional Kotlin/Compose/Material 3 UI; Arabic RTL and French; language selection/settings switching; Algerian vehicle catalog; diagnostic codes with symptoms/causes/tests/repair guidance; guided diagnosis; OBD-ready abstraction and scanner/PID handling; history/reports; offline/local knowledge; secure Supabase/RLS; accessibility; performance; unit/UI/runtime tests; emulator smoke tests when infrastructure supports it; release APK/AAB hardening. Do not invent automotive facts, diagnostic results, prices, or hardware validation. Record blockers and next milestone in agent-state.md. Do not push: the workflow handles the commit/push."

      - name: Commit and safely synchronize agent changes
        run: |
          set -euo pipefail
          git config user.name "CarDiag Autonomous Engineer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes produced by agent."
            exit 0
          fi
          git add -A
          git diff --cached --check
          git commit -m "chore(agent): autonomous engineering cycle"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                exit 0
              fi
            else
              git rebase --abort || true
            fi
            sleep $((attempt * 5))
          done
          echo "Unable to synchronize agent commit with origin/main after 3 attempts."
          exit 1

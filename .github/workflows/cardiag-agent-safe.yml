name: CarDiag Autonomous Engineer (safe)

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

concurrency:
  group: cardiag-autonomous-engineer
  cancel-in-progress: false

permissions:
  contents: write
  actions: read
  pull-requests: write
  issues: write

jobs:
  agent:
    name: Autonomous engineering cycle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: android/**/*.gradle*

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Verify Android project
        working-directory: android
        run: |
          test -f ./gradlew
          chmod +x ./gradlew
          ./gradlew --version

      - name: Baseline validation
        continue-on-error: true
        working-directory: android
        run: ./gradlew test lint assembleDebug --stacktrace

      - name: Verify OpenRouter secret is present
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "OPENROUTER_API_KEY GitHub Actions secret is missing or empty."
            exit 1
          fi
          echo "OPENROUTER_API_KEY secret is present."

      - name: Run coding agent through OpenRouter
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          npm install -g @openai/codex
          cat > /tmp/codex-config.toml <<'EOF'
          model_provider = "openrouter"
          model = "openai/gpt-oss-20b:free"
          model_reasoning_effort = "high"

          [model_providers.openrouter]
          name = "OpenRouter"
          base_url = "https://openrouter.ai/api/v1"
          env_key = "OPENROUTER_API_KEY"
          wire_api = "responses"
          EOF
          codex exec --config /tmp/codex-config.toml --full-auto --skip-git-repo-check --sandbox workspace-write --model openai/gpt-oss-20b:free "You are the autonomous principal engineer for ${{ github.repository }}. The Android project is under android/. Read AGENTS.md and agent-state.md first. Continue the CarDiag project toward the complete professional-product Definition of Done, not merely repair CI. Inspect the repository and recent failures, choose the highest-impact unfinished milestone or production blocker, inspect relevant architecture/tests/resources before editing, make production-correct changes, add regression tests where appropriate, validate from android/, never weaken tests or commit secrets, do not make speculative broad rewrites, and do not commit or push because the workflow handles that. Priorities: correctness/crash prevention > CI/build > security > data integrity > tests > architecture > UX/UI > optimization > new features. Requirements include professional Kotlin/Compose/Material 3 UI; Arabic RTL and French; language selection/settings switching; Algerian vehicle catalog; diagnostic codes with symptoms/causes/tests/repair guidance; guided diagnosis; OBD-ready abstraction and scanner/PID handling; history/reports; offline/local knowledge; secure Supabase/RLS; accessibility; performance; unit/UI/runtime tests; emulator smoke tests when infrastructure supports it; release APK/AAB hardening. Do not invent automotive facts, diagnostic results, prices, or hardware validation. Record blockers and next milestone in agent-state.md."

      - name: Commit validated agent changes
        run: |
          git config user.name "CarDiag Autonomous Engineer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git diff --cached --check
            git commit -m "chore(agent): autonomous engineering cycle"
            git push origin HEAD:main
          else
            echo "No changes produced by agent."
          fi

name: CarDiag Autonomous Engineer (safe)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write
  pull-requests: write
  issues: write

concurrency:
  group: cardiag-agent-main
  cancel-in-progress: false

env:
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  OPENROUTER_MODEL: openrouter/free

jobs:
  agent:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.CARDIAG_WORKFLOW_TOKEN }}

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Baseline validation
        working-directory: android
        continue-on-error: true
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug --stacktrace

      - name: Verify OpenRouter key
        run: test -n "$OPENROUTER_API_KEY"

      - name: Install Codex CLI
        run: npm install -g @openai/codex

      - name: Run coding agent through OpenRouter
        env:
          CODEX_HOME: ${{ github.workspace }}/.codex
        run: |
          set -euo pipefail
          mkdir -p "$CODEX_HOME"
          cat > "$CODEX_HOME/config.toml" <<'EOF'
model = "openrouter/free"
model_provider = "openrouter"
model_reasoning_effort = "high"
approval_policy = "never"
sandbox_mode = "danger-full-access"

[model_providers.openrouter]
name = "OpenRouter"
base_url = "https://openrouter.ai/api/v1"
env_key = "OPENROUTER_API_KEY"
EOF
          codex exec --full-auto --skip-git-repo-check "Read AGENTS.md and agent-state.md first. Act as the principal engineer for CarDiag DZ. Inspect the current repository and latest CI state. Identify the highest-priority blocker toward the project's Definition of Done, then implement the smallest complete production-quality fix. Preserve existing behavior unless improvement is required. Add or update regression tests when appropriate. Do not weaken tests, disable lint, remove real functionality, expose secrets, or make broad rewrites without evidence. Validate changes as far as the environment permits and update agent-state.md with what you changed, validation evidence, and the next prioritized work. If the repository is already healthy, make one meaningful next improvement rather than cosmetic churn."

      - name: Commit and push agent changes with PAT
        env:
          GH_TOKEN: ${{ secrets.CARDIAG_WORKFLOW_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes produced by agent."
            exit 0
          fi
          git add -A
          git commit -m "chore(agent): autonomous engineering cycle"
          git fetch origin main
          git rebase origin/main
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git push origin HEAD:main

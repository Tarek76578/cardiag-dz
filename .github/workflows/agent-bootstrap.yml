name: CarDiag Agent Bootstrap

on:
  workflow_dispatch:

permissions:
  actions: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch single rebuilt Agent
        env:
          GH_TOKEN: ${{ secrets.CARDIAG_WORKFLOW_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh workflow run .github/workflows/cardiag-agent.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "CarDiag Autonomous Agent dispatch accepted."

name: CarDiag Autonomous Agent

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  pull-requests: write
  issues: write

concurrency:
  group: cardiag-autonomous-agent
  cancel-in-progress: false

env:
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  GH_TOKEN: ${{ secrets.CARDIAG_WORKFLOW_TOKEN }}

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.CARDIAG_WORKFLOW_TOKEN }}

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Baseline Android validation
        working-directory: android
        continue-on-error: true
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug --stacktrace

      - name: Verify credentials
        run: |
          test -n "$OPENROUTER_API_KEY"
          test -n "$GH_TOKEN"

      - name: Install Codex
        run: npm install -g @openai/codex

      - name: Autonomous principal engineer cycle
        env:
          CODEX_HOME: ${{ github.workspace }}/.codex
        run: |
          set -euo pipefail
          mkdir -p "$CODEX_HOME"
          cat > "$CODEX_HOME/config.toml" <<'EOF'
model = "openrouter/free"
model_provider = "openrouter"
model_reasoning_effort = "high"
approval_policy = "never"
sandbox_mode = "danger-full-access"

[model_providers.openrouter]
name = "OpenRouter"
base_url = "https://openrouter.ai/api/v1"
env_key = "OPENROUTER_API_KEY"
EOF
          codex exec --full-auto --skip-git-repo-check "You are the autonomous principal engineer, product engineer, QA engineer, security reviewer, and release engineer for CarDiag DZ. Your mission is to make the current repository a genuinely production-quality commercial Android product for the Algerian automotive market, with minimal human intervention. Read AGENTS.md and agent-state.md first. Inspect the entire repository, current application behavior, data, architecture, UX, localization, security posture, and CI. Build an evidence-based prioritized backlog and work through the highest-impact incomplete items. You have authority to modify application code, tests, resources, Gradle, data, documentation, and CI/CD. Preserve Arabic RTL and French localization. Prioritize correctness, security, data integrity, reliability, UX, architecture, testing and release quality before cosmetic changes. Never weaken tests, suppress real defects, fabricate automotive/pricing/service data, or expose secrets. Use actual repository and CI evidence. Run the strongest available validation including integrity/secret checks, compilation, unit tests, lint, debug APK, and release APK/AAB when appropriate. If a check fails, inspect the actual failure and fix its root cause. Update agent-state.md with evidence, completed work, blockers, and next priorities. Commit coherent production-quality changes to main. Do not declare the project complete merely because a build is green; continue through the highest-value actionable work available in this cycle."

      - name: Final integrity check
        run: |
          set -euo pipefail
          git diff --check
          test -f AGENTS.md
          test -f agent-state.md

      - name: Commit and push agent changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No changes produced by agent.'
            exit 0
          fi
          git add -A
          git commit -m 'chore(agent): autonomous engineering cycle'
          git fetch origin main
          git rebase origin/main
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git push origin HEAD:main

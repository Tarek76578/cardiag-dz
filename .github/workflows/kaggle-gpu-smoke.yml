name: CarDiag Kaggle GPU Smoke Test

on:
  workflow_dispatch:
  push:
    paths:
      - 'kaggle/**'
      - '.github/workflows/kaggle-gpu-smoke.yml'

permissions:
  contents: read

concurrency:
  group: cardiag-kaggle-gpu-smoke
  cancel-in-progress: true

jobs:
  kaggle-gpu-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate Kaggle credential without exposing it
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}"
          python3 -m pip install --disable-pip-version-check --no-input --upgrade kaggle
          kaggle --version
          python3 - <<'PY'
          import os
          token=os.environ.get("KAGGLE_API_TOKEN", "")
          assert token and len(token) >= 20, "KAGGLE_API_TOKEN is missing or unexpectedly short"
          print("KAGGLE_TOKEN_PRESENT=1")
          print("KAGGLE_TOKEN_LENGTH_CLASS=" + ("short" if len(token) < 40 else "normal"))
          PY

      - name: Check Kaggle accelerator quota before scheduling
        run: |
          set +e
          echo '--- Kaggle accelerator quota ---'
          kaggle quota 2>&1 | tee /tmp/kaggle-quota.log
          rc=${PIPESTATUS[0]}
          echo "KAGGLE_QUOTA_EXIT=$rc"
          exit 0

      - name: Initialize a private Kaggle kernel and discover account slug
        id: kernel
        working-directory: /tmp
        run: |
          set -euo pipefail
          rm -rf cardiag-kaggle-smoke
          mkdir -p cardiag-kaggle-smoke
          cd cardiag-kaggle-smoke
          kaggle kernels init -p .
          test -s kernel-metadata.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("kernel-metadata.json")
          data=json.loads(p.read_text())
          owner=data.get("id", "").split("/",1)[0]
          if not owner or owner in {"your-username", "username", "INSERT_KERNEL_SLUG_HERE"}:
              raise SystemExit("Kaggle CLI did not return a usable account slug")
          print("KAGGLE_OWNER=" + owner)
          Path("owner.txt").write_text(owner)
          PY
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("kernel-metadata.json")
          data=json.loads(p.read_text())
          owner=data["id"].split("/",1)[0]
          slug="cardiag-gpu-smoke"
          data.update({
              "id": f"{owner}/{slug}",
              "title": "CarDiag GPU Smoke",
              "code_file": "cardiag_gpu_smoke.py",
              "language": "python",
              "kernel_type": "script",
              "is_private": True,
              "enable_gpu": True,
              "enable_internet": False,
              "machine_shape": "NvidiaTeslaT4",
              "dataset_sources": [],
              "competition_sources": [],
              "kernel_sources": [],
              "model_sources": [],
          })
          p.write_text(json.dumps(data, indent=2) + "\n")
          print("KERNEL_REF=" + data["id"])
          Path("kernel-ref.txt").write_text(data["id"])
          PY
          cp "$GITHUB_WORKSPACE/kaggle/cardiag_gpu_smoke.py" .
          test -f cardiag_gpu_smoke.py
          echo "kernel_ref=$(cat kernel-ref.txt)" >> "$GITHUB_OUTPUT"

      - name: Push Kaggle GPU worker
        working-directory: /tmp/cardiag-kaggle-smoke
        run: |
          set -euo pipefail
          kaggle kernels push -p .

      - name: Wait for Kaggle worker
        id: wait
        working-directory: /tmp/cardiag-kaggle-smoke
        run: |
          set -euo pipefail
          ref="$(cat kernel-ref.txt)"
          final=""
          for i in $(seq 1 36); do
            status="$(kaggle kernels status "$ref" 2>&1 || true)"
            printf '%s\n' "$status"
            case "$status" in
              *KernelWorkerStatus.COMPLETE*) final=success; break ;;
              *KernelWorkerStatus.ERROR*) final=failure; break ;;
              *KernelWorkerStatus.CANCELLED*|*KernelWorkerStatus.CANCELED*) final=failure; break ;;
            esac
            sleep 10
          done
          echo "KAGGLE_FINAL_STATUS=${final:-timeout}"
          if [ "$final" != success ]; then
            exit 1
          fi

      - name: Collect Kaggle diagnostics on failure
        if: failure()
        working-directory: /tmp/cardiag-kaggle-smoke
        run: |
          set +e
          ref="$(cat kernel-ref.txt)"
          echo '--- FINAL KAGGLE STATUS ---'
          kaggle kernels status "$ref" 2>&1 || true
          echo '--- KAGGLE KERNEL LOGS ---'
          kaggle kernels logs "$ref" 2>&1 | tee /tmp/kaggle-kernel.log || true
          echo '--- KAGGLE OUTPUT ---'
          rm -rf output-on-failure
          mkdir -p output-on-failure
          kaggle kernels output "$ref" -p output-on-failure --force 2>&1 || true
          find output-on-failure -maxdepth 2 -type f -print -exec sh -c 'echo "--- $1"; tail -200 "$1"' _ {} \; || true
          echo '--- KAGGLE QUOTA AFTER RUN ---'
          kaggle quota 2>&1 || true

      - name: Download and verify worker output
        if: success()
        working-directory: /tmp/cardiag-kaggle-smoke
        run: |
          set -euo pipefail
          ref="$(cat kernel-ref.txt)"
          rm -rf output
          mkdir -p output
          kaggle kernels output "$ref" -p output --force
          grep -R -q 'CARDIAG_KAGGLE_WORKER=OK' output
          echo 'KAGGLE_GPU_WORKER=OK'

      - name: Cleanup remote test kernel
        if: always()
        working-directory: /tmp/cardiag-kaggle-smoke
        run: |
          set +e
          if [ -s kernel-ref.txt ]; then
            kaggle kernels delete "$(cat kernel-ref.txt)" --yes || true
          fi

name: CarDiag Kaggle GPU Smoke Test

on:
  workflow_dispatch:
  push:
    paths:
      - 'kaggle/**'
      - '.github/workflows/kaggle-gpu-smoke.yml'

permissions:
  contents: read

concurrency:
  group: cardiag-kaggle-gpu-smoke
  cancel-in-progress: true

jobs:
  kaggle-gpu-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_GPU_MACHINE: NvidiaTeslaT4
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate Kaggle credential without exposing it
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}"
          python3 -m pip install --disable-pip-version-check --no-input --upgrade kaggle
          kaggle --version
          python3 - <<'PY'
          import os
          token=os.environ.get("KAGGLE_API_TOKEN", "")
          assert token and len(token) >= 20, "KAGGLE_API_TOKEN is missing or unexpectedly short"
          print("KAGGLE_TOKEN_PRESENT=1")
          print("KAGGLE_TOKEN_LENGTH_CLASS=" + ("short" if len(token) < 40 else "normal"))
          PY

      - name: Check Kaggle accelerator quota before scheduling
        run: |
          set +e
          kaggle quota 2>&1 | tee /tmp/kaggle-quota.log
          rc=${PIPESTATUS[0]}
          echo "KAGGLE_QUOTA_EXIT=$rc"
          exit 0

      - name: Run verified Kaggle GPU worker with allocation retries
        id: gpu
        working-directory: /tmp
        run: |
          set -euo pipefail
          rm -rf cardiag-kaggle-smoke
          mkdir -p cardiag-kaggle-smoke
          cd cardiag-kaggle-smoke
          cp "$GITHUB_WORKSPACE/kaggle/cardiag_gpu_smoke.py" .
          final_ref=""
          success=0

          for attempt in 1 2 3; do
            slug="cardiag-gpu-smoke-${GITHUB_RUN_ID}-${attempt}"
            work="attempt-${attempt}"
            rm -rf "$work"
            mkdir -p "$work"
            cp cardiag_gpu_smoke.py "$work/"
            cd "$work"
            kaggle kernels init -p . >/dev/null
            python3 - "$slug" "$KAGGLE_GPU_MACHINE" <<'PY'
          import json, sys
          from pathlib import Path
          slug, machine = sys.argv[1:]
          p=Path("kernel-metadata.json")
          data=json.loads(p.read_text())
          owner=data["id"].split("/",1)[0]
          data.update({
              "id": f"{owner}/{slug}",
              "title": slug,
              "code_file": "cardiag_gpu_smoke.py",
              "language": "python",
              "kernel_type": "script",
              "is_private": True,
              "enable_gpu": True,
              "enable_internet": False,
              "machine_shape": machine,
              "dataset_sources": [],
              "competition_sources": [],
              "kernel_sources": [],
              "model_sources": [],
          })
          p.write_text(json.dumps(data, indent=2) + "\n")
          print("KERNEL_REF=" + data["id"])
          PY
            ref="$(python3 -c 'import json; print(json.load(open("kernel-metadata.json"))["id"])')"
            echo "--- attempt $attempt: $ref / $KAGGLE_GPU_MACHINE ---"
            kaggle kernels push -p .
            final=""
            for i in $(seq 1 48); do
              status="$(kaggle kernels status "$ref" 2>&1 || true)"
              printf '%s\n' "$status"
              case "$status" in
                *KernelWorkerStatus.COMPLETE*) final=success; break ;;
                *KernelWorkerStatus.ERROR*) final=failure; break ;;
                *KernelWorkerStatus.CANCELLED*|*KernelWorkerStatus.CANCELED*) final=failure; break ;;
              esac
              sleep 10
            done
            echo "KAGGLE_ATTEMPT_${attempt}_STATUS=${final:-timeout}"
            if [ "$final" = success ]; then
              rm -rf output
              mkdir -p output
              kaggle kernels output "$ref" -p output --force
              if grep -R -q 'CARDIAG_KAGGLE_WORKER=OK' output; then
                success=1
                final_ref="$ref"
                break
              fi
            fi
            echo '--- attempt diagnostics ---'
            kaggle kernels status "$ref" 2>&1 || true
            kaggle kernels logs "$ref" 2>&1 | tail -200 || true
            kaggle kernels delete "$ref" --yes || true
            cd ..
          done

          echo "final_ref=$final_ref" >> "$GITHUB_OUTPUT"
          if [ "$success" -ne 1 ]; then
            echo 'No verified CUDA-capable Kaggle worker was obtained after 3 attempts.'
            exit 1
          fi
          echo 'KAGGLE_GPU_WORKER=OK'

      - name: Cleanup remote test kernel
        if: always()
        working-directory: /tmp/cardiag-kaggle-smoke
        run: |
          set +e
          ref="${{ steps.gpu.outputs.final_ref }}"
          if [ -n "$ref" ]; then
            kaggle kernels delete "$ref" --yes || true
          fi

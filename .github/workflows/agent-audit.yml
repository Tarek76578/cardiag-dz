name: CarDiag Agent Audit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  agent:
    name: Agent audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Audit repository
        run: |
          set -euo pipefail
          echo "CarDiag Agent is running"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Commit: $GITHUB_SHA"
          test -f AGENTS.md
          test -f android/app/build.gradle.kts
          test -f android/gradlew
          git diff --check
          echo "AGENT_AUDIT_TRIGGER_OK"

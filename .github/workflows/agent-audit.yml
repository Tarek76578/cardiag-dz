name: CarDiag Agent

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cardiag-agent
  cancel-in-progress: false

jobs:
  agent:
    name: Autonomous audit, research, engineering and validation
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify repository baseline
        run: |
          set -euo pipefail
          test -f AGENTS.md
          test -f android/gradlew
          test -f android/app/build.gradle.kts
          git diff --check

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Codex
        run: npm install -g @openai/codex

      - name: Run autonomous engineering cycle
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CODEX_HOME: ${{ github.workspace }}/.codex
        run: |
          set -euo pipefail
          test -n "$OPENROUTER_API_KEY"
          mkdir -p "$CODEX_HOME"
          cat > "$CODEX_HOME/config.toml" <<'EOF'
model = "openrouter/free"
model_provider = "openrouter"
approval_policy = "never"
sandbox_mode = "danger-full-access"

[model_providers.openrouter]
name = "OpenRouter"
base_url = "https://openrouter.ai/api/v1"
env_key = "OPENROUTER_API_KEY"
EOF
          codex exec --full-auto --skip-git-repo-check "You are the sole autonomous principal engineer, QA engineer, security reviewer, automotive diagnostics reviewer, researcher and release engineer for CarDiag DZ. Read AGENTS.md first and inspect the entire repository before making changes.

MISSION: continuously improve the actual CarDiag product, not merely write a report.

PHASE 1 — DEEP AUDIT: inspect Android/Kotlin/Compose architecture, navigation/state, crashes, lifecycle, permissions, Bluetooth/OBD/ELM327 handling, VIN/DTC/live data, vehicle catalog/data integrity, Arabic RTL, French localization, accessibility, adaptive layouts, UI consistency, loading/empty/error states, performance, battery, privacy, Supabase/auth/RLS security, secrets, dependencies, Gradle, tests, runtime coverage, release configuration and CI.

PHASE 2 — RESEARCH: use fresh public web research available in the runner. Prefer official Android/Google documentation and authoritative OBD/automotive references, then reputable competitor documentation and current Algerian automotive-market sources. Compare CarDiag with Carista, OBDeleven and Torque. Record URLs and access dates. Never fabricate automotive facts, prices, services, compatibility, DTC meanings or test results.

PHASE 3 — PRIORITIZE: rank findings by severity, user impact, security risk, correctness and release impact. Fix the highest-value VERIFIED problems that can safely be fixed in this run. Do not make cosmetic or speculative changes merely to create commits.

PHASE 4 — ENGINEER: implement robust fixes, preserve existing behavior unless the audit proves it is defective, add or improve tests for meaningful changes, and never weaken/delete tests or suppress failures. Keep Arabic RTL and French support intact.

PHASE 5 — VALIDATE: run formatting/static checks where available and real Gradle tests/lint/build. If a check cannot run, document the exact blocker. Diagnose failures at root cause instead of hiding them.

PHASE 6 — DOCUMENT: update agent-state.md with date, audit scope, evidence, research sources, findings, changes, validation results, blockers and next priorities. Update market-audit.md with researched sources and dated conclusions.

PHASE 7 — SAFETY: never commit credentials, never modify GitHub secrets, never invent data, never delete user/product functionality without evidence, never create another workflow or another agent, and do not change this workflow file.

At the end, leave all safe verified improvements in the working tree."

      - name: Validate Android project
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease bundleRelease --stacktrace

      - name: Final integrity check
        run: |
          set -euo pipefail
          git diff --check
          test -f AGENTS.md

      - name: Commit autonomous improvements
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No verified changes to commit.'
            exit 0
          fi
          git commit -m 'chore(agent): autonomous audit and engineering cycle'
          git push origin HEAD:main

      - name: Upload release and reports
        uses: actions/upload-artifact@v6
        with:
          name: cardiag-agent-results
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
            market-audit.md
            agent-state.md
          if-no-files-found: warn
          retention-days: 14

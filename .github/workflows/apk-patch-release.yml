name: Patch Release APK (no Gradle build)

on:
  push:
    paths:
      - 'tools/patch_release_dex.py'
      - '.github/workflows/apk-patch-release.yml'
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Source GitHub Actions run ID'
        required: true
        default: '32936420867'
      artifact_id:
        description: 'Release APK artifact ID'
        required: true
        default: '9595092166'

permissions:
  contents: read
  actions: read

jobs:
  patch-release-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch tooling
        uses: actions/checkout@v4

      - name: Resolve source artifact
        id: source
        env:
          INPUT_RUN_ID: ${{ inputs.run_id }}
          INPUT_ARTIFACT_ID: ${{ inputs.artifact_id }}
        run: |
          set -euo pipefail
          RUN_ID="${INPUT_RUN_ID:-32936420867}"
          ARTIFACT_ID="${INPUT_ARTIFACT_ID:-9595092166}"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "artifact_id=$ARTIFACT_ID" >> "$GITHUB_OUTPUT"

      - name: Download exact Release APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.source.outputs.run_id }}
          ARTIFACT_ID: ${{ steps.source.outputs.artifact_id }}
        run: |
          set -euo pipefail
          curl --fail --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o release-artifact.zip
          unzip -l release-artifact.zip
          unzip -q release-artifact.zip -d source-artifact
          APK="$(find source-artifact -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" source-release.apk

      - name: Verify source APK identity
        run: |
          set -euo pipefail
          unzip -p source-release.apk classes.dex > classes.dex
          python3 - <<'PY'
          from pathlib import Path
          b = Path('classes.dex').read_bytes()
          sig = bytes.fromhex('33 27 1b ff 00 00 00 00 71 20 e3 53 10 00 0b 00 68 00 be 2b 18 00')
          assert b.find(sig) >= 0, 'Source APK is not the verified CarDiag Release shape.'
          for name in ('CarDiagExactApp','ExactVehicleProfileScreen','GuidedDiagnosisScreen','DiagnosticCodeRow','setArabic','setDark'):
              assert name.encode() in b, f'missing expected symbol: {name}'
          print('Verified Compose Release APK from the requested run.')
          PY

      - name: Patch only the verified Compose theme constants
        run: |
          set -euo pipefail
          python3 tools/patch_release_dex.py classes.dex
          unzip -q -o source-release.apk -d apk-tree
          cp classes.dex apk-tree/classes.dex

      - name: Repackage and align (no Gradle build)
        run: |
          set -euo pipefail
          SDK_BUILD_TOOLS="$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$SDK_BUILD_TOOLS/zipalign"
          "$SDK_BUILD_TOOLS/zipalign" -f -p 4 apk-tree patched-unaligned.apk

      - name: Create ephemeral signing key for this patched artifact
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore cardiag-patch-test.jks \
            -storepass changeit \
            -keypass changeit \
            -alias cardiag-patch-test \
            -keyalg RSA -keysize 2048 -validity 3650 \
            -dname 'CN=CarDiag APK Patch Test, O=CarDiag, C=DZ'

      - name: Sign patched APK with Android apksigner
        run: |
          set -euo pipefail
          SDK_BUILD_TOOLS="$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$SDK_BUILD_TOOLS/apksigner"
          "$SDK_BUILD_TOOLS/apksigner" sign \
            --ks cardiag-patch-test.jks \
            --ks-pass pass:changeit \
            --key-pass pass:changeit \
            --ks-key-alias cardiag-patch-test \
            --out cardiag-release-patched.apk \
            patched-unaligned.apk
          "$SDK_BUILD_TOOLS/apksigner" verify --verbose cardiag-release-patched.apk

      - name: Verify patched APK contents
        run: |
          set -euo pipefail
          unzip -p cardiag-release-patched.apk classes.dex > patched-classes.dex
          python3 - <<'PY'
          from pathlib import Path
          b = Path('patched-classes.dex').read_bytes()
          for h in ('FF2563EB','FF1D4ED8','FF38BDF8','FF7DD3FC','FF070A0F','FF0E141D','FF151E2A','FF243244','FF22C55E','FFF59E0B','FFEF4444'):
              assert bytes.fromhex(h)[::-1] in b, f'missing patched color {h}'
          print('Patched palette markers verified in classes.dex.')
          PY

      - name: Upload patched APK
        uses: actions/upload-artifact@v4
        with:
          name: cardiag-release-patched-no-build
          path: cardiag-release-patched.apk
          if-no-files-found: error
          retention-days: 14

name: CarDiag GPS Agent

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: cardiag-gps-agent
  cancel-in-progress: false

env:
  OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
  OPENROUTER_WIRE_API: responses
  OPENROUTER_PROXY_MAX_TOKENS: '12000'

jobs:
  gps-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify repository
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          test -f AGENTS.md
          test -f docs/agent-next-task.md
          test -f agent-state.md
          test -x scripts/autonomous-agent.sh
          test -f scripts/openrouter-codex-proxy.py
          test -x android/gradlew
          test -f android/app/build.gradle.kts
          test -n "${{ secrets.OPEN_ROUTER_API_KEY }}"

      - name: Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Node and Codex
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install Codex
        run: |
          set -euo pipefail
          rm -rf /tmp/codex-cli
          npm install --prefix /tmp/codex-cli --no-save @openai/codex
          echo "/tmp/codex-cli/node_modules/.bin" >> "$GITHUB_PATH"
          codex --version

      - name: OpenRouter preflight
        id: provider
        env:
          OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 -H "Authorization: Bearer $OPEN_ROUTER_API_KEY" "$OPENROUTER_BASE_URL/models" -o /tmp/models.json
          python3 - /tmp/models.json <<'PY' > /tmp/model.txt
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          ms=d.get('data',[])
          def score(m):
              x=(m.get('id') or '').lower()
              p=set(m.get('supported_parameters') or [])
              if 'tools' not in p and 'tool_choice' not in p: return -1
              if any(k in x for k in ('vision','audio','image','tts','whisper','embed','moderation')): return -1
              return (100000 if x.endswith(':free') else 0)+(5000 if 'code' in x or 'coder' in x else 0)+(4000 if 'gpt-oss' in x else 0)+min(int(m.get('context_length') or 0),128000)//1000
          candidates=sorted((m for m in ms if score(m)>0),key=score,reverse=True)
          for m in candidates:
              print(m['id']); break
          PY
          test -s /tmp/model.txt
          echo "model=$(cat /tmp/model.txt)" >> "$GITHUB_OUTPUT"

      - name: Start token interceptor
        env:
          OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
        run: |
          set -euo pipefail
          python3 scripts/openrouter-codex-proxy.py >/tmp/openrouter-proxy.log 2>&1 &
          echo $! >/tmp/proxy.pid
          sleep 1
          kill -0 "$(cat /tmp/proxy.pid)"
          python3 - <<'PY'
          import json, urllib.request
          req=urllib.request.Request('http://127.0.0.1:8787/v1/responses',data=json.dumps({'model':'interceptor-test','input':'x','max_output_tokens':65536}).encode(),headers={'Content-Type':'application/json'},method='POST')
          try: urllib.request.urlopen(req,timeout=3)
          except Exception: pass
          PY
          grep -Eq 'TOKEN_(CLAMP|INJECT).*effective=12000' /tmp/openrouter-proxy.log
          echo 'TOKEN_INTERCEPTOR_TEST=PASS'

      - name: Run GPS-only Codex agent
        env:
          OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
          CODEX_PROVIDER: openrouter
          AI_PROVIDER: openrouter
          AI_MODEL: ${{ steps.provider.outputs.model }}
          CODEX_BASE_URL: http://127.0.0.1:8787/v1
          CODEX_ENV_KEY: OPEN_ROUTER_API_KEY
          CODEX_WIRE_API: responses
          OPENROUTER_PROXY_MAX_TOKENS: '12000'
        run: |
          set -euo pipefail
          export CODEX_HOME="$HOME/.codex-cardiag"
          mkdir -p "$CODEX_HOME"
          ./scripts/autonomous-agent.sh

      - name: Validate Android
        if: success()
        working-directory: android
        run: timeout 600s ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug --stacktrace

      - name: Commit verified GPS changes
        if: success()
        run: |
          set -euo pipefail
          git diff --check
          test -n "$(git status --porcelain)"
          git add -A
          git diff --cached --check
          git commit -m 'feat: advance CarDiag GPS milestone'
          git push origin HEAD:main

name: CarDiag GPS Agent

on:
  workflow_dispatch: {}
  push:
    branches:
      - feat/multi-provider-ai-gateway
      - fix/auto-free-model-discovery
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: cardiag-gps-agent-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
  OPENROUTER_WIRE_API: responses
  OPENROUTER_MODEL: ${{ vars.AI_MODEL || '' }}
  AI_MODEL: ${{ vars.AI_MODEL || '' }}
  AI_GATEWAY_MAX_OUTPUT_TOKENS: '12000'
  AI_GATEWAY_PROVIDER_ORDER: openrouter,groq,deepseek

jobs:
  gps-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify repository
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          test -f AGENTS.md
          test -f docs/agent-next-task.md
          test -f agent-state.md
          test -x scripts/autonomous-agent.sh
          test -f scripts/ai-gateway.py
          test -f scripts/test_ai_gateway.py
          test -x android/gradlew
          test -f android/app/build.gradle.kts
          python3 -m py_compile scripts/ai-gateway.py
          python3 scripts/test_ai_gateway.py
          bash -n scripts/autonomous-agent.sh
          test -n "${{ secrets.OPEN_ROUTER_API_KEY }}${{ secrets.GROQ_API_KEY }}${{ secrets.DEEPSEEK_API_KEY }}"

      - name: Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install Codex CLI
        run: |
          set -euo pipefail
          npm install --global --no-audit --no-fund @openai/codex@0.151.0
          command -v codex
          codex --version

      - name: Start gateway for agent rotation
        env:
          OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          python3 scripts/ai-gateway.py >/tmp/cardiag-ai-gateway.log 2>&1 &
          echo $! >/tmp/gateway.pid
          for i in $(seq 1 30); do
            curl -fsS --max-time 1 http://127.0.0.1:8787/health >/tmp/gateway-health.json 2>/dev/null && break
            sleep 1
          done
          kill -0 "$(cat /tmp/gateway.pid)"
          cat /tmp/gateway-health.json

      - name: Run GPS-only Codex agent with persistent free-model rotation
        env:
          OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          CARDIAG_GATEWAY_KEY: local-gateway-key
          CODEX_PROVIDER: cardiag_gateway
          CODEX_BASE_URL: http://127.0.0.1:8787/v1
          CODEX_ENV_KEY: CARDIAG_GATEWAY_KEY
          CODEX_WIRE_API: responses
          AI_GATEWAY_MAX_OUTPUT_TOKENS: '12000'
          AI_GATEWAY_PROVIDER_ORDER: openrouter,groq,deepseek
          AI_AGENT_MAX_CYCLES: '24'
        run: |
          set -euo pipefail
          ./scripts/autonomous-agent.sh

      - name: Upload agent checkpoint on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cardiag-gps-agent-checkpoint-${{ github.run_id }}
          path: |
            /tmp/cardiag-agent-checkpoint/
            agent-state.md
            docs/agent-next-task.md
          if-no-files-found: warn
          retention-days: 7

      - name: Validate Android
        if: success()
        working-directory: android
        run: timeout 600s ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug --stacktrace

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CarDiag-debug-APK-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Commit verified GPS changes
        if: success() && github.event_name == 'push'
        run: |
          set -euo pipefail
          git diff --check
          test -n "$(git status --porcelain)"
          git add -A
          git diff --cached --check
          git commit -m 'feat: advance CarDiag GPS milestone'
          git push origin HEAD:main

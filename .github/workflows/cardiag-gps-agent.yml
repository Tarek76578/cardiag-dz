name: CarDiag GPS Agent

on:
  workflow_dispatch: {}
  push:
    branches:
      - feat/multi-provider-ai-gateway
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: cardiag-gps-agent-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
  OPENROUTER_WIRE_API: responses
  OPENROUTER_MODEL: openrouter/free
  AI_MODEL: openrouter/free
  AI_PROVIDER: openrouter
  AI_GATEWAY_MAX_OUTPUT_TOKENS: '12000'
  AI_GATEWAY_PROVIDER_ORDER: openrouter,groq,deepseek

jobs:
  gps-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify repository
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          test -f AGENTS.md
          test -f docs/agent-next-task.md
          test -f agent-state.md
          test -x scripts/autonomous-agent.sh
          test -f scripts/ai-gateway.py
          test -f scripts/test_ai_gateway.py
          test -x android/gradlew
          test -f android/app/build.gradle.kts
          test -n "${{ secrets.OPEN_ROUTER_API_KEY }}${{ secrets.GROQ_API_KEY }}${{ secrets.DEEPSEEK_API_KEY }}"
          python3 -m py_compile scripts/ai-gateway.py
          python3 scripts/test_ai_gateway.py
          bash -n scripts/autonomous-agent.sh

      - name: Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install Codex CLI
        run: |
          set -euo pipefail
          npm install --global --no-audit --no-fund @openai/codex@0.151.0
          command -v codex
          codex --version
          codex --help >/dev/null

      - name: Start and self-test CarDiag AI Gateway
        env:
          OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          python3 scripts/ai-gateway.py >/tmp/cardiag-ai-gateway.log 2>&1 &
          echo $! >/tmp/gateway.pid
          for i in $(seq 1 30); do
            curl -fsS --max-time 1 http://127.0.0.1:8787/health >/tmp/gateway-health.json 2>/dev/null && break
            sleep 1
          done
          kill -0 "$(cat /tmp/gateway.pid)"
          python3 - <<'PY'
          import json, urllib.error, urllib.request
          health=json.load(urllib.request.urlopen('http://127.0.0.1:8787/health',timeout=5))
          assert health['status'] == 'ok'
          configured=[n for n,i in health['providers'].items() if i['configured'] and i['codex_compatible']]
          assert configured, 'No Codex-compatible AI provider configured'
          tool={"type":"function","name":"gateway_probe","description":"Return a fixed probe result","parameters":{"type":"object","properties":{"ok":{"type":"boolean"}},"required":["ok"],"additionalProperties":False}}
          payload={'model':'openrouter/free','input':[{'role':'user','content':[{'type':'input_text','text':'Reply with exactly OK.'}]}],'tools':[tool],'tool_choice':'none','parallel_tool_calls':True,'max_output_tokens':16}
          req=urllib.request.Request('http://127.0.0.1:8787/v1/responses',data=json.dumps(payload).encode(),headers={'Content-Type':'application/json','Accept':'application/json'},method='POST')
          try:
              with urllib.request.urlopen(req,timeout=90) as response:
                  assert response.status == 200, response.status
                  data=json.loads(response.read())
                  assert data.get('object') == 'response', data
          except urllib.error.HTTPError as exc:
              detail=exc.read().decode('utf-8','replace')
              raise SystemExit(f'Gateway Codex-compatibility probe failed HTTP {exc.code}: {detail}')
          print('AI_GATEWAY_CODEX_COMPAT_PROBE=PASS')
          PY
          grep -Eq 'ROUTE provider=' /tmp/cardiag-ai-gateway.log
          selected="$(grep 'ROUTE provider=' /tmp/cardiag-ai-gateway.log | tail -n 1 | sed -E 's/^.*ROUTE provider=([^ ]+) model=([^ ]+) attempt=.*/\1 \2/')"
          test -n "$selected"
          provider="${selected%% *}"
          model="${selected#* }"
          test -n "$provider"; test -n "$model"
          echo "AI_GATEWAY_SELECTED_PROVIDER=$provider"
          echo "AI_GATEWAY_SELECTED_MODEL=$model"
          echo "AI_GATEWAY_SELECTED_PROVIDER=$provider" >> "$GITHUB_ENV"
          echo "AI_GATEWAY_SELECTED_MODEL=$model" >> "$GITHUB_ENV"
          echo "AI_MODEL=$model" >> "$GITHUB_ENV"
          echo "AI_PROVIDER=$provider" >> "$GITHUB_ENV"
          cat /tmp/gateway-health.json
          cat /tmp/cardiag-ai-gateway.log

      - name: Restart Gateway on verified provider/model
        env:
          OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          : "${AI_GATEWAY_SELECTED_PROVIDER:?missing selected provider}"
          : "${AI_GATEWAY_SELECTED_MODEL:?missing selected model}"
          old_pid="$(cat /tmp/gateway.pid)"
          kill "$old_pid" 2>/dev/null || true
          for i in $(seq 1 10); do
            if ! kill -0 "$old_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          export AI_PROVIDER="$AI_GATEWAY_SELECTED_PROVIDER"
          export AI_MODEL="$AI_GATEWAY_SELECTED_MODEL"
          case "$AI_GATEWAY_SELECTED_PROVIDER" in
            openrouter) export OPENROUTER_MODEL="$AI_GATEWAY_SELECTED_MODEL" ;;
            groq) export GROQ_MODEL="$AI_GATEWAY_SELECTED_MODEL" ;;
            deepseek) export DEEPSEEK_MODEL="$AI_GATEWAY_SELECTED_MODEL" ;;
            *) echo "Unsupported selected provider: $AI_GATEWAY_SELECTED_PROVIDER" >&2; exit 18 ;;
          esac
          python3 scripts/ai-gateway.py >/tmp/cardiag-ai-gateway-codex.log 2>&1 &
          echo $! >/tmp/gateway.pid
          for i in $(seq 1 30); do
            curl -fsS --max-time 1 http://127.0.0.1:8787/health >/tmp/gateway-codex-health.json 2>/dev/null && break
            sleep 1
          done
          kill -0 "$(cat /tmp/gateway.pid)"
          python3 - <<'PY'
          import json, os, urllib.request
          h=json.load(urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=5))
          provider=os.environ['AI_GATEWAY_SELECTED_PROVIDER']
          model=os.environ['AI_GATEWAY_SELECTED_MODEL']
          p=h['providers'][provider]
          assert p['configured'] and p['codex_compatible'], p
          assert p['model'] == model, p
          print('AI_GATEWAY_CODEX_ROUTE=PASS')
          print(f'AI_GATEWAY_SELECTED_PROVIDER={provider}')
          print(f'AI_GATEWAY_SELECTED_MODEL={model}')
          PY
          cat /tmp/gateway-codex-health.json
          cat /tmp/cardiag-ai-gateway-codex.log

      - name: Run GPS-only Codex agent
        env:
          OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          CARDIAG_GATEWAY_KEY: local-gateway-key
          CODEX_PROVIDER: cardiag_gateway
          CODEX_BASE_URL: http://127.0.0.1:8787/v1
          CODEX_ENV_KEY: CARDIAG_GATEWAY_KEY
          CODEX_WIRE_API: responses
          AI_GATEWAY_MAX_OUTPUT_TOKENS: '12000'
          AI_GATEWAY_PROVIDER_ORDER: openrouter,groq,deepseek
        run: |
          set -euo pipefail
          test -n "${AI_MODEL:-}" || { echo 'AI_MODEL was not selected by Gateway probe' >&2; exit 17; }
          test -n "${AI_PROVIDER:-}" || { echo 'AI_PROVIDER was not selected by Gateway probe' >&2; exit 18; }
          test -n "${AI_GATEWAY_SELECTED_PROVIDER:-}" || { echo 'AI_GATEWAY_SELECTED_PROVIDER missing' >&2; exit 19; }
          test -n "${AI_GATEWAY_SELECTED_MODEL:-}" || { echo 'AI_GATEWAY_SELECTED_MODEL missing' >&2; exit 20; }
          test "$AI_MODEL" = "$AI_GATEWAY_SELECTED_MODEL"
          test "$AI_PROVIDER" = "$AI_GATEWAY_SELECTED_PROVIDER"
          echo "CODEX_EFFECTIVE_PROVIDER=$AI_PROVIDER"
          echo "CODEX_EFFECTIVE_MODEL=$AI_MODEL"
          export CODEX_HOME="$HOME/.codex-cardiag"
          mkdir -p "$CODEX_HOME"
          ./scripts/autonomous-agent.sh

      - name: Validate Android
        if: success()
        working-directory: android
        run: timeout 600s ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug --stacktrace

      - name: Commit verified GPS changes
        if: success() && github.event_name == 'push'
        run: |
          set -euo pipefail
          git diff --check
          test -n "$(git status --porcelain)"
          git add -A
          git diff --cached --check
          git commit -m 'feat: advance CarDiag GPS milestone'
          git push origin HEAD:main

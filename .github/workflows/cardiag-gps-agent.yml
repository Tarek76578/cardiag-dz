name: CarDiag GPS Agent

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: cardiag-gps-agent
  cancel-in-progress: false

env:
  OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
  OPENROUTER_WIRE_API: responses
  AI_GATEWAY_MAX_OUTPUT_TOKENS: '12000'
  AI_GATEWAY_PROVIDER_ORDER: openrouter,groq,nvidia,deepseek,gemini

jobs:
  gps-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Normalize clean working tree
        run: |
          set -euo pipefail
          git fetch origin main --prune
          git reset --hard origin/main
          git clean -fdx
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          test -z "$(git status --porcelain)"
          echo "GIT_BASE=$(git rev-parse HEAD)"

      - name: Verify repository
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          test -f AGENTS.md
          test -f docs/agent-next-task.md
          test -f agent-state.md
          test -x scripts/autonomous-agent.sh
          test -f scripts/ai-gateway.py
          test -x android/gradlew
          test -f android/app/build.gradle.kts
          test -n "${{ secrets.OPEN_ROUTER_API_KEY }}"
          python3 -m py_compile scripts/ai-gateway.py scripts/openrouter-codex-proxy.py
          bash -n scripts/autonomous-agent.sh

      - name: Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install Codex CLI
        run: |
          set -euo pipefail
          npm install --global --no-audit --no-fund @openai/codex@0.151.0
          command -v codex
          codex --version
          codex --help >/dev/null

      - name: Start and self-test CarDiag AI Gateway
        env:
          OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: |
          set -euo pipefail
          python3 scripts/ai-gateway.py >/tmp/cardiag-ai-gateway.log 2>&1 &
          echo $! >/tmp/gateway.pid
          for i in $(seq 1 30); do
            curl -fsS --max-time 1 http://127.0.0.1:8787/health >/tmp/gateway-health.json 2>/dev/null && break
            sleep 1
          done
          kill -0 "$(cat /tmp/gateway.pid)"
          python3 - <<'PY'
          import json, urllib.request
          health=json.load(urllib.request.urlopen('http://127.0.0.1:8787/health',timeout=5))
          assert health['status'] == 'ok'
          PY
          python3 - <<'PY'
          import json, urllib.request
          req=urllib.request.Request('http://127.0.0.1:8787/v1/responses',data=json.dumps({'model':'interceptor-test','input':'Reply with exactly OK','max_output_tokens':65536}).encode(),headers={'Content-Type':'application/json','Accept':'application/json'},method='POST')
          try: urllib.request.urlopen(req,timeout=20)
          except Exception: pass
          PY
          grep -Eq 'ROUTE provider=' /tmp/cardiag-ai-gateway.log
          echo 'AI_GATEWAY_SELF_TEST=PASS'
          cat /tmp/gateway-health.json
          cat /tmp/cardiag-ai-gateway.log

      - name: Run GPS-only Codex agent
        env:
          OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          CODEX_PROVIDER: cardiag_gateway
          AI_PROVIDER: openrouter
          AI_MODEL: ${{ vars.AI_MODEL || 'openai/gpt-oss-120b:free' }}
          CODEX_BASE_URL: http://127.0.0.1:8787/v1
          CODEX_ENV_KEY: OPEN_ROUTER_API_KEY
          CODEX_WIRE_API: responses
          AI_GATEWAY_MAX_OUTPUT_TOKENS: '12000'
          AI_GATEWAY_PROVIDER_ORDER: openrouter,groq,nvidia,deepseek,gemini
        run: |
          set -euo pipefail
          export CODEX_HOME="$HOME/.codex-cardiag"
          mkdir -p "$CODEX_HOME"
          ./scripts/autonomous-agent.sh

      - name: Validate Android
        if: success()
        working-directory: android
        run: timeout 600s ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug --stacktrace

      - name: Commit verified GPS changes
        if: success()
        run: |
          set -euo pipefail
          git diff --check
          test -n "$(git status --porcelain)"
          git add -A
          git diff --cached --check
          git commit -m 'feat: advance CarDiag GPS milestone'
          git push origin HEAD:main

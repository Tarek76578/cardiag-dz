name: Android Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Make Gradle executable
        working-directory: android
        run: chmod +x ./gradlew

      - name: Repair DiagnosticScreen source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/java/dz/cardiag/app/ModernMainActivity.kt')
          s = p.read_text(encoding='utf-8')
          start = s.index('@Composable\nprivate fun DiagnosticScreen(')
          end = s.index('@Composable\nprivate fun DiagnosisResultCard', start)
          replacement = '''@Composable
private fun DiagnosticScreen(padding: PaddingValues, ar: Boolean, requestBluetoothPermissions: () -> Unit) {
    val context = LocalContext.current
    val scope = rememberCoroutineScope()
    val service = remember { DiagnosticService() }
    val obd = remember { ObdService() }
    var complaint by rememberSaveable { mutableStateOf("") }
    var running by remember { mutableStateOf(false) }
    var result by remember { mutableStateOf<JsonObject?>(null) }
    var status by rememberSaveable { mutableStateOf(if (ar) "غير متصل" else "Non connecté") }
    var dtc by remember { mutableStateOf<List<String>>(emptyList()) }
    var live by remember { mutableStateOf<Map<String, String>>(emptyMap()) }
    var error by remember { mutableStateOf<String?>(null) }
    val online = NetworkStatus.isOnline(context)
    LazyColumn(Modifier.fillMaxSize().padding(padding), contentPadding = PaddingValues(18.dp), verticalArrangement = Arrangement.spacedBy(14.dp)) {
        item {
            SectionTitle(if (ar) "التشخيص" else "Diagnostic")
            Text(if (ar) "استخدم OBD-II مع وصف المشكلة للحصول على تحليل منظم." else "Combinez OBD-II et symptômes pour une analyse structurée.", color = MaterialTheme.colorScheme.onSurfaceVariant)
        }
        if (!online) item { OfflineBanner(ar) }
        item {
            Card {
                Column(Modifier.padding(16.dp), verticalArrangement = Arrangement.spacedBy(10.dp)) {
                    Text(if (ar) "وصف المشكلة" else "Symptômes", fontWeight = FontWeight.Bold)
                    OutlinedTextField(value = complaint, onValueChange = { complaint = it }, modifier = Modifier.fillMaxWidth(), minLines = 3, label = { Text(if (ar) "مثال: المحرك يهتز عند التوقف" else "Ex. moteur instable au ralenti") })
                    Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                        OutlinedButton(onClick = requestBluetoothPermissions) {
                            Icon(Icons.Default.Bluetooth, contentDescription = null)
                            Spacer(Modifier.width(4.dp))
                            Text("Bluetooth")
                        }
                        Button(onClick = {
                            val permissionMissing = Build.VERSION.SDK_INT >= 31 && context.checkSelfPermission(Manifest.permission.BLUETOOTH_CONNECT) != PackageManager.PERMISSION_GRANTED
                            if (permissionMissing) {
                                requestBluetoothPermissions()
                            } else {
                                val device: BluetoothDevice? = obd.bondedDevices().firstOrNull()
                                if (device == null) {
                                    status = if (ar) "لا يوجد محول ELM327 مقترن" else "Aucun adaptateur ELM327 appairé"
                                } else {
                                    scope.launch {
                                        try {
                                            status = obd.connect(device)
                                            dtc = obd.readTroubleCodes()
                                            live = mapOf(
                                                "RPM" to (obd.readRpm()?.let { "%.0f rpm".format(it) } ?: "—"),
                                                "Coolant" to (obd.readCoolantTemperature()?.let { "%.1f °C".format(it) } ?: "—"),
                                                "Speed" to (obd.readVehicleSpeedKmh()?.let { "%.0f km/h".format(it) } ?: "—")
                                            )
                                        } catch (e: Exception) {
                                            status = e.message ?: "OBD error"
                                        }
                                    }
                                }
                            }
                        }) { Text(if (ar) "اتصال وفحص" else "Connecter") }
                    }
                    Text(status, color = MaterialTheme.colorScheme.primary)
                    if (dtc.isNotEmpty()) Text("DTC: ${dtc.joinToString()}", color = MaterialTheme.colorScheme.error)
                    live.forEach { (key, value) -> Text("$key: $value") }
                }
            }
        }
        item {
            Button(onClick = {
                if (!online) {
                    error = if (ar) "الاتصال بالإنترنت مطلوب لتحليل AI." else "Internet requis pour l'analyse IA."
                } else if (complaint.isBlank() && dtc.isEmpty()) {
                    error = if (ar) "أدخل الأعراض أو اتصل بـOBD أولًا." else "Ajoutez des symptômes ou connectez l'OBD."
                } else {
                    scope.launch {
                        running = true
                        error = null
                        try {
                            val measurementJson = buildJsonObject { live.forEach { (key, value) -> put(key, value) } }
                            result = withContext(Dispatchers.IO) {
                                service.runDiagnostic(null, complaint, if (ar) "ar" else "fr", dtc, buildJsonObject { put("complaint", complaint) }, measurementJson)
                            }
                        } catch (e: Exception) {
                            error = e.message ?: if (ar) "فشل التشخيص" else "Échec du diagnostic"
                        } finally {
                            running = false
                        }
                    }
                }
            }, modifier = Modifier.fillMaxWidth(), enabled = !running) {
                if (running) CircularProgressIndicator(strokeWidth = 2.dp) else Text(if (ar) "تحليل بالذكاء الاصطناعي" else "Analyser avec l'IA")
            }
        }
        if (error != null) item { Text(error!!, color = MaterialTheme.colorScheme.error) }
        if (result != null) item { DiagnosisResultCard(result!!, ar) }
    }
}

'''
          p.write_text(s[:start] + replacement + s[end:], encoding='utf-8')
          PY

      - name: Verify source integrity
        run: |
          grep -q 'private fun DiagnosticScreen' android/app/src/main/java/dz/cardiag/app/ModernMainActivity.kt
          grep -q 'private fun DiagnosisResultCard' android/app/src/main/java/dz/cardiag/app/ModernMainActivity.kt
          git diff --check

      - name: Commit source repair
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source changes needed"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add android/app/src/main/java/dz/cardiag/app/ModernMainActivity.kt
            git commit -m "fix: repair DiagnosticScreen Kotlin source [skip ci]"
            git push
          fi

      - name: Build and test debug APK
        working-directory: android
        run: ./gradlew --no-daemon clean testDebugUnitTest lintDebug assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CarDiag-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

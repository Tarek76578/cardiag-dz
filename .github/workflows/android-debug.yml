name: Android Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Make Gradle executable
        working-directory: android
        run: chmod +x ./gradlew

      - name: Repair known Kotlin syntax defect
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/java/dz/cardiag/app/ModernMainActivity.kt')
          s = p.read_text(encoding='utf-8')
          old = '                        } }\n                    }) { Text(if (ar) "اتصال وفحص" else "Connecter") }'
          new = '                        }\n                    }) { Text(if (ar) "اتصال وفحص" else "Connecter") }'
          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')
              print('Repaired DiagnosticScreen syntax')
          else:
              print('DiagnosticScreen syntax already repaired')
          PY

      - name: Verify source integrity
        run: |
          test -f android/app/src/main/java/dz/cardiag/app/ModernMainActivity.kt
          grep -q 'private fun DiagnosticScreen' android/app/src/main/java/dz/cardiag/app/ModernMainActivity.kt
          grep -q 'private fun DiagnosisResultCard' android/app/src/main/java/dz/cardiag/app/ModernMainActivity.kt
          ! grep -q '^                        } }$' android/app/src/main/java/dz/cardiag/app/ModernMainActivity.kt
          git diff --check

      - name: Build and test debug APK
        working-directory: android
        run: ./gradlew --no-daemon clean testDebugUnitTest lintDebug assembleDebug --stacktrace

      - name: Persist source repair
        if: success()
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source changes to persist"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add android/app/src/main/java/dz/cardiag/app/ModernMainActivity.kt
            git commit -m "fix: repair DiagnosticScreen Kotlin syntax [skip ci]"
            git push
          fi

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CarDiag-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

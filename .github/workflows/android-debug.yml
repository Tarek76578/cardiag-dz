name: Android Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Make Gradle executable
        working-directory: android
        run: chmod +x ./gradlew

      - name: Verify source integrity
        working-directory: android
        run: |
          test -f app/src/main/java/dz/cardiag/app/ModernMainActivity.kt
          grep -q 'private fun DiagnosticScreen' app/src/main/java/dz/cardiag/app/ModernMainActivity.kt
          grep -q 'private fun DiagnosisResultCard' app/src/main/java/dz/cardiag/app/ModernMainActivity.kt

      - name: Build and test debug APK
        working-directory: android
        run: ./gradlew --no-daemon clean testDebugUnitTest lintDebug assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CarDiag-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

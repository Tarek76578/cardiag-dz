name: One-time source repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, 'repair DiagnosticScreen braces') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Repair ModernMainActivity.kt
        shell: python
        run: |
          from pathlib import Path
          path = Path('android/app/src/main/java/dz/cardiag/app/ModernMainActivity.kt')
          text = path.read_text(encoding='utf-8')
          old = '                        } }\n                    }) { Text(if (ar) "اتصال وفحص" else "Connecter") }'
          new = '                        } } }\n                    }) { Text(if (ar) "اتصال وفحص" else "Connecter") }'
          if old not in text:
              raise SystemExit('Expected broken brace sequence was not found; refusing to modify the file.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Commit repair and remove helper workflow
        shell: bash
        run: |
          rm -f .github/workflows/one-time-fix-modern.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/app/src/main/java/dz/cardiag/app/ModernMainActivity.kt .github/workflows/one-time-fix-modern.yml
          git diff --cached --check
          git commit -m 'repair DiagnosticScreen braces'
          git push
